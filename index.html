<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- 확대·축소를 막습니다. 손가락으로 당겨 화면이 한 번 줄어들면
     안전영역(상태바) 계산이 통째로 어긋나 헤더가 시계와 겹칩니다.
     ⚠️ 예전에 이 값이 독립 앱 모드에서 입력칸 포커스를 막은 적이 있습니다.
        로그인 칸이 눌리지 않으면 아래 줄로 되돌리세요.
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
     입력칸 글자는 16px 이라 자동 확대는 일어나지 않습니다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>버던_재고</title>

<link rel="apple-touch-icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<link rel="icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버던재고">
<meta name="theme-color" content="#30382A">

<style>
/* ══════════════════════════════════════════════════════
   버던_재고 v6.3   (버던_재고 API v3.6)

   ⚠️ 이 버전은 verdan-core 를 쓰지 않고 단독으로 동작합니다.
      새 UI 구조(스플래시 · 접히는 헤더 · 하단 내비 · 마이페이지 ·
      라이트/다크)를 실제 데이터로 먼저 검증하기 위해서입니다.
      검증이 끝나면 이 파일의 CSS/JS 공통부를 verdan-core 1.2.0 으로
      옮기고, 이 파일은 다시 코어를 참조하는 형태로 되돌립니다.

   v5.1 → v6.0
   ① 스플래시 1초 → 로그인 (자동 로그인이면 바로 본 화면)
   ② 헤더 = 로고+화살표 / 앱이름  ·  새로고침 / ↻ 갱신시각
      스크롤을 내리면 접히고 올리면 즉시 내려옵니다 (임계값 THRESH)
   ③ 하위 세그먼트를 밑줄 방식으로. 값 선택용은 버튼 유지
   ④ 각 화면 맨 아래 [새로고침] 3곳 삭제 → 헤더 하나로
   ⑤ 접근로그 · 로그아웃을 마이페이지로 이동. 하단 내비 [홈][마이페이지]
   ⑥ 이모지를 단색 SVG 아이콘 · 상태 점으로 교체
   ⑦ 라이트/다크 색 토큰 두 벌
   ══════════════════════════════════════════════════════ */

/* ── 색 토큰 · 라이트 ───────────────────────────────
   ⚠️ 색 코드를 직접 쓰지 마세요. 여기 값만 참조합니다. */
:root{
  /* 예전 --v-ink 이 헤더 · 주버튼 · 강조글자를 겸했는데,
     다크에서 셋이 서로 다른 방향으로 가야 해서 쪼갰습니다. */
  --v-header:#30382A;        /* 헤더 — 라이트/다크 동일 (같은 브랜드로 보이게) */
  --v-cta:#30382A;           /* 주버튼 배경 */
  --v-cta-txt:#FFFFFF;       /* 주버튼 글자 */
  --v-strong:#30382A;        /* 강조 글자 */

  --v-accent:#829568;
  --v-accent2:#B2C58E;
  --v-bg:#F7F6F1;
  --v-card:#FFFFFF;
  --v-soft:#FAFAF7;
  --v-thead:#F2F1EC;
  --v-seg:#EDEDE7;
  --v-line:#E5E6DF;
  --v-txt:#252721;
  --v-mute:#696C64;
  --v-ph:#A9AAA3;
  --v-onink:#FFFFFF;
  --v-link:#71869B;
  --v-stale:#F0C9C6;
  --v-wm:#252721;
  --v-track:#E5E6DF;

  --v-ok:#64815A;      --v-ok-bg:#EFF2EC;      --v-ok-line:#CFDAC6;
  --v-warn:#B1844E;    --v-warn-bg:#F7F1E6;    --v-warn-line:#E3D2B4;
  --v-danger:#B45F59;  --v-danger-bg:#F6EBEA;  --v-danger-line:#E4C6C4;

  --v-d1:#B77C7C; --v-d2:#C48262; --v-d3:#8A7FA8; --v-d4:#71869B; --v-d5:#6D6462;

  --v-radius:14px;
  --wm-op:.05;
  --hh:64px;              /* 헤더 높이 — JS 가 실측해 넣습니다 */
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ── 색 토큰 · 다크 ─────────────────────────────────
   색을 뒤집는 게 아니라 밝기로 층을 나눕니다.
   bg < card < soft < seg 순서로 밝아집니다. */
[data-theme="dark"]{
  --v-header:#30382A;
  --v-cta:#B2C58E;           /* 어두운 배경에서 Deep Olive 는 묻힙니다 */
  --v-cta-txt:#23261F;
  --v-strong:#E8EAE3;

  --v-accent:#9FB283;
  --v-accent2:#B2C58E;
  --v-bg:#191B15;
  --v-card:#23261F;
  --v-soft:#2B2E26;
  --v-thead:#2B2E26;
  --v-seg:#32362C;
  --v-line:#383B31;
  --v-txt:#E8EAE3;
  --v-mute:#9AA093;
  --v-ph:#6E7468;
  --v-onink:#FFFFFF;
  --v-link:#9FB4C8;
  --v-stale:#E4A5A0;
  --v-wm:#E8EAE3;
  --v-track:#32362C;

  --v-ok:#8FAE83;      --v-ok-bg:#232A20;      --v-ok-line:#3A4834;
  --v-warn:#D6A96A;    --v-warn-bg:#2E271B;    --v-warn-line:#4A3E28;
  --v-danger:#D98A84;  --v-danger-bg:#2E211F;  --v-danger-line:#4C3230;

  --v-d1:#C99191; --v-d2:#D89A78; --v-d3:#A196BE; --v-d4:#8AA0B6; --v-d5:#8C8380;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* ── 화면 뼈대 ──────────────────────────────────────
   바깥(문서)은 스크롤되지 않게 잠그고 안쪽 판(.page)만 스크롤합니다.
   문서 전체가 스크롤되면 iOS 에서 고무줄 반동이 생기고 주소창이
   오르내리며 화면 높이가 계속 바뀌어 헤더·탭이 흔들립니다. */
/* 스플래시가 걷히기 전까지는 문서 바탕도 올리브로 둡니다.
   안 그러면 화면 맨 아래(홈 인디케이터 쪽)에 밝은 띠가 남습니다. */
/* 문서 바탕(canvas) — 화면 맨 아래에 앱 바깥 영역이 남는 기기가 있습니다.
   그 자리는 body 가 아무리 늘어나도 닿지 않고 이 색이 보입니다.
   색은 JS(paintCanvas)가 화면에 맞춰 직접 넣습니다.
   CSS 클래스를 겹쳐 쓰면 규칙 하나만 어긋나도 조용히 무시됩니다. */
html{height:100%;overflow:hidden;background:#30382A;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,Arial,sans-serif;
  /* ⚠️ 여기에 앱 배경색을 두면 안 됩니다.
     iOS 독립 앱은 화면 아래 '앱 바깥' 자리를 body 배경색으로 칠합니다.
     그 색은 JS(canvas)가 화면에 맞춰 넣고, 앱 배경은 #app·#gate 가 갖습니다. */
  background:#30382A;color:var(--v-txt);
  /* ⚠️ 높이를 계산해서 넣지 않습니다.
     innerHeight · visualViewport.height 는 기기·상황에 따라 홈 인디케이터
     몫이 빠질 때가 있어 화면 맨 아래에 띠가 남습니다.
     네 변을 0 으로 붙이면 그런 계산 자체가 없어집니다.
     키보드가 올라올 때만 JS 가 높이를 잠깐 대신 잡습니다. */
  position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
  display:flex;flex-direction:column;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  transition:background-color .25s var(--ease),color .25s var(--ease);}

/* ── 스플래시 ────────────────────────────────────── */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#30382A;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s var(--ease);}
#splash.gone{opacity:0;pointer-events:none;}
#splash .logo{width:200px;height:auto;display:block;}

/* ── 로그인 ─────────────────────────────────────── */
#gate{background:var(--v-bg);flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;display:none;
  flex-direction:column;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom));}
#gate.on{display:flex;}
#gate .logo{width:140px;height:auto;display:block;margin-bottom:14px;}
#gate .sub{font-size:13px;color:var(--v-mute);margin-bottom:26px;margin-left:3px;}
#gate input{width:100%;padding:15px 16px;border:1px solid var(--v-line);border-radius:12px;
  font-size:16px;margin-bottom:9px;font-family:inherit;background:var(--v-soft);color:var(--v-txt);
  -webkit-user-select:text;user-select:text;touch-action:manipulation;}
#gate input::placeholder{color:var(--v-ph);}
#gate input:focus{outline:none;border-color:var(--v-accent);background:var(--v-card);}
#gate button{width:100%;padding:15px;border:none;border-radius:12px;background:var(--v-cta);
  color:var(--v-cta-txt);font-size:15px;font-weight:700;font-family:inherit;margin-top:5px;}
#gate button:disabled{opacity:.55;}
#gateMsg{font-size:13px;color:var(--v-danger);margin-top:12px;min-height:18px;line-height:1.6;
  text-align:center;}
#gateMsg.wait{color:var(--v-mute);}
#gate .hint{font-size:11px;color:var(--v-mute);margin-top:12px;line-height:1.7;text-align:center;}

/* ── 앱 뼈대 ────────────────────────────────────── */
#app{background:var(--v-bg);display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
#app.on{display:flex;}

/* 헤더 + 탭을 한 덩어리로 묶습니다.
   접히면 margin-top 을 헤더 높이만큼 음수로 줘서 헤더가 위로 잘려 나갑니다. */
/* 안전영역(상태바) 여백은 #chrome 이 갖습니다.
   헤더만 위로 미끄러져 잘리므로, 접혀도 탭이 상태바에 파고들지 않습니다. */
/* 무신사 실측 — 안전영역 아래 16px 에 탭 글자, 바 하단 107px.
   안전영역(59) + 6px + 탭 위 여백(12px) = 77px, 바 하단 105px 로 맞춥니다. */
#chrome{flex-shrink:0;z-index:30;background:var(--v-header);
  padding-top:calc(env(safe-area-inset-top) + 6px);}
/* ⚠️ overflow:hidden 은 패딩 상자 기준으로 자릅니다.
   안전영역 패딩을 #chrome 이 갖고 자르기는 이 안쪽 상자가 맡아야
   헤더가 상태바(시계·배터리) 영역으로 올라오지 않습니다. */
#headWrap{overflow:hidden;}
#header{padding:6px 18px 12px;display:flex;align-items:flex-start;gap:12px;
  color:var(--v-onink);
  transition:margin-top .26s var(--ease), opacity .16s linear;}
/* 미끄러져 올라가면서 함께 흐려집니다. 그냥 밀려 올라가면 뚝 끊겨 보입니다. */
#chrome.up #header{margin-top:calc(-1 * var(--hh));opacity:0;}
#brandBtn{display:flex;align-items:center;gap:7px;background:none;border:none;
  color:var(--v-onink);font-family:inherit;padding:0;}
#brandBtn .logo{width:88px;height:auto;display:block;}
#brandBtn .chev{width:19px;height:19px;border:1px solid rgba(255,255,255,.34);border-radius:5px;
  display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease);}
#brandBtn .chev svg{width:12px;height:12px;}
#brandBtn.open .chev{transform:rotate(180deg);}
#header .app{font-size:11.5px;opacity:.62;margin-top:8px;margin-left:3px;}
#header .rt{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;}
/* 얇은 외곽선 + 얇은 글씨. 채워진 버튼이 아닙니다. */
#rfBtn{background:none;border:1px solid rgba(255,255,255,.3);border-radius:9px;
  color:var(--v-onink);font-family:inherit;font-size:11.5px;font-weight:400;padding:6px 13px;}
#rfBtn:active{background:rgba(255,255,255,.1);}
/* 도는 아이콘은 버튼이 아니라 갱신시각 옆에 있습니다 */
#stampRow{display:flex;align-items:center;gap:5px;margin-top:5px;
  font-size:10.5px;opacity:.55;font-variant-numeric:tabular-nums;}
#stampRow.stale{opacity:1;color:var(--v-stale);font-weight:700;}
#stampRow svg{width:11px;height:11px;}
#stampRow.busy svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

#tabs{display:flex;padding:0 8px;}
#tabs button{flex:1;padding:12px 4px 11px;border:none;background:none;font-family:inherit;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.5);position:relative;}
#tabs button.on{color:#fff;font-weight:800;}
#tabs button.on::after{content:'';position:absolute;left:14%;right:14%;bottom:0;height:2.5px;
  background:#fff;border-radius:2px;}

.page{display:none;padding:16px 16px 0;}
/* 목록 끝 여백은 20px 이면 충분합니다.
   예전에는 화면 맨 아래에 하단 내비가 없어서 여기서 안전영역(홈 인디케이터)
   여백까지 떠안았습니다. 이제 그 몫은 #bottom 이 갖고 있으므로,
   여기에 또 넣으면 목록 끝에 60px 넘는 빈 자리가 영구히 남습니다. */
.page.on{display:block;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;padding-bottom:20px;}

/* ── 카테고리 — 위에서 내려오는 판 ─────────────────── */
#catWrap{position:fixed;left:0;right:0;top:0;z-index:61;pointer-events:none;}
#catPanel{background:var(--v-bg);border-bottom:1px solid var(--v-line);
  transform:translateY(-100%);transition:transform .3s var(--ease);
  padding:calc(14px + env(safe-area-inset-top)) 14px 0;pointer-events:auto;}
#catWrap.on #catPanel{transform:translateY(0);}
#catGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
#catGrid a{background:var(--v-card);border:1px solid var(--v-line);border-radius:12px;
  padding:15px 14px;text-decoration:none;display:block;}
#catGrid a .t{font-size:14.5px;font-weight:700;color:var(--v-strong);
  display:flex;align-items:center;gap:5px;}
#catGrid a .t svg{width:13px;height:13px;opacity:.45;}
#catGrid a .d{font-size:11px;color:var(--v-mute);margin-top:3px;}
#catClose{display:flex;justify-content:flex-end;padding:14px 4px;}
#catClose button{background:none;border:none;font-family:inherit;font-size:12.5px;
  font-weight:600;color:var(--v-mute);text-decoration:underline;text-underline-offset:3px;}
#scrim{position:fixed;inset:0;background:rgba(20,22,17,.42);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .25s var(--ease);}
#scrim.on{opacity:1;pointer-events:auto;}

/* ── 세그먼트 ────────────────────────────────────
   .seg-nav  화면을 바꾸는 탐색용 — 밑줄 막대
   .seg-pick 값을 고르는 컨트롤 — 버튼 (테마 전환 등) */
.seg-nav{display:flex;gap:2px;border-bottom:1px solid var(--v-line);margin:-4px -16px 16px;
  padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.seg-nav::-webkit-scrollbar{display:none;}
.seg-nav button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--v-mute);padding:9px 12px 10px;position:relative;white-space:nowrap;}
.seg-nav button.on{color:var(--v-strong);font-weight:800;}
.seg-nav button.on::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;
  background:var(--v-strong);border-radius:2px;}

.seg-pick{display:flex;gap:4px;background:var(--v-seg);border-radius:11px;padding:4px;}
.seg-pick button{flex:1;padding:9px 4px;border:none;border-radius:8px;background:none;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--v-mute);white-space:nowrap;}
.seg-pick button.on{background:var(--v-card);color:var(--v-strong);
  box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ── 카드 · 입력 ──────────────────────────────────
   -webkit-user-select:text 가 없으면 독립 앱 모드에서 칸이 '선택만 되고
   편집은 안 되는' 상태로 빠져 키보드가 올라오지 않습니다. */
.card{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  padding:16px;margin-bottom:12px;}
.card h3{font-size:12px;color:var(--v-mute);font-weight:700;margin-bottom:12px;}
select,input.f,button.f{width:100%;padding:13px 14px;border:1px solid var(--v-line);
  border-radius:12px;font-size:16px;margin-bottom:9px;font-family:inherit;
  background:var(--v-soft);color:var(--v-txt);touch-action:manipulation;}
select{-webkit-appearance:none;appearance:none;padding-right:36px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;}
select.ph{color:var(--v-ph);}
input.f{-webkit-user-select:text;user-select:text;}
input.f::placeholder{color:var(--v-ph);}
input.f:focus,select:focus{outline:none;border-color:var(--v-accent);background:var(--v-card);}
button.f{background:var(--v-cta);color:var(--v-cta-txt);border:none;font-weight:700;margin-top:3px;}
button.f:disabled{opacity:.5;}
button.ghost{background:transparent;color:var(--v-strong);border:1px solid var(--v-line);
  font-weight:600;}

/* ── 구획 머리 — 이모지 대신 점 ───────────────────── */
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 9px;font-size:12.5px;
  font-weight:700;color:var(--v-strong);}
.sec .cnt{margin-left:auto;font-size:11.5px;color:var(--v-mute);font-weight:600;
  font-variant-numeric:tabular-nums;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;
  background:var(--v-mute);}
.dot.ok{background:var(--v-ok);} .dot.warn{background:var(--v-warn);}
.dot.danger{background:var(--v-danger);} .dot.mute{background:var(--v-ph);}
.dot.d1{background:var(--v-d1);} .dot.d2{background:var(--v-d2);}
.dot.d3{background:var(--v-d3);} .dot.d4{background:var(--v-d4);}

/* ── 안내 상자 ────────────────────────────────────── */
.box{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:12.5px;line-height:1.75;
  border:1px solid;}
.box.ok{background:var(--v-ok-bg);border-color:var(--v-ok-line);color:var(--v-ok);}
.box.note{background:var(--v-warn-bg);border-color:var(--v-warn-line);color:var(--v-warn);}
.box.danger{background:var(--v-danger-bg);border-color:var(--v-danger-line);color:var(--v-danger);}
.box b{font-weight:800;}
.box .hd{display:flex;align-items:center;gap:7px;font-weight:800;}
/* 점 색은 상자 글자색을 따라갑니다. 상자마다 따로 지정하면 어긋납니다. */
.box .hd .dot{background:currentColor;}
/* 머리줄 아래 간격을 한 곳에서 정합니다 — 상자마다 달라 보이지 않게 */
.box .bd{margin-top:9px;}
.box .bd > div + div{margin-top:11px;}

.summary{display:flex;align-items:baseline;gap:8px;padding:2px 2px 14px;}
.summary .big{font-size:22px;font-weight:800;color:var(--v-strong);
  font-variant-numeric:tabular-nums;}
.summary .lb{font-size:12px;color:var(--v-mute);}

/* ── 표 ───────────────────────────────────────────── */
.tbl{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  overflow:hidden;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{padding:9px 12px;text-align:right;font-size:10.5px;font-weight:600;color:var(--v-mute);
  background:var(--v-thead);white-space:nowrap;}
th:first-child{text-align:left;}
td{padding:11px 12px;border-top:1px solid var(--v-line);text-align:right;
  font-variant-numeric:tabular-nums;}
td:first-child{text-align:left;}
tbody tr:first-child td{border-top:none;}
.nm{font-weight:600;color:var(--v-txt);}
.sub2{font-size:10.5px;color:var(--v-mute);line-height:1.6;margin-top:2px;}
.muted{color:var(--v-ph);}
.dg{color:var(--v-danger);font-weight:700;}
.lnk{color:var(--v-link);font-weight:600;border-bottom:1px solid currentColor;
  padding-bottom:1px;font-size:12.5px;}
.foot-note{font-size:11px;color:var(--v-mute);line-height:1.85;padding:2px 2px 6px;}
.msg{font-size:12px;margin-top:8px;min-height:16px;line-height:1.6;}
.msg.err{color:var(--v-danger);} .msg.good{color:var(--v-ok);}

/* 거래처 상세 */
.vd{background:var(--v-soft);padding:13px 14px !important;text-align:left !important;}
.vd .row{display:grid;grid-template-columns:78px 1fr;gap:2px 12px;font-size:12px;line-height:1.9;}
.vd .row .k{color:var(--v-mute);font-weight:600;}
.vd a{color:var(--v-link);}

details{background:var(--v-card);border:1px solid var(--v-line);border-radius:var(--v-radius);
  margin-bottom:12px;overflow:hidden;}
details summary{list-style:none;padding:13px 15px;font-size:12.5px;font-weight:700;
  color:var(--v-strong);display:flex;align-items:center;gap:8px;}
details summary::-webkit-details-marker{display:none;}
details summary .cnt{margin-left:auto;font-size:11.5px;color:var(--v-mute);font-weight:600;}
details summary .chev{transition:transform .2s var(--ease);color:var(--v-mute);display:flex;}
details[open] summary .chev{transform:rotate(90deg);}
details .tbl{border:none;border-radius:0;border-top:1px solid var(--v-line);margin:0;}

/* ── 하단 내비 ────────────────────────────────────── */
/* 무신사 실측 — 내용 52px + 홈 인디케이터 영역.
   안전영역이 0 인 기기(구형·안드로이드)에서도 최소 8px 은 남깁니다. */
/* 아래 여백은 JS(fitBottom)가 기기에 맞춰 넣습니다.
   앱 바깥으로 남는 자리가 이미 홈 인디케이터를 덮는 기기가 있어,
   env() 를 그대로 쓰면 같은 여백이 두 번 들어갑니다. */
#bottom{flex-shrink:0;display:flex;background:var(--v-card);border-top:1px solid var(--v-line);
  padding-bottom:var(--navpad, 8px);z-index:40;}
#bottom button{flex:1;border:none;background:none;font-family:inherit;padding:8px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--v-ph);}
#bottom button.on{color:var(--v-strong);}
#bottom svg{width:22px;height:22px;}
#bottom .lb{font-size:10px;font-weight:600;}

/* ── 마이페이지 ───────────────────────────────────── */
.mp-top{display:flex;align-items:center;gap:13px;padding:6px 2px 22px;}
.mp-top .av{width:46px;height:46px;border-radius:50%;background:var(--v-accent2);flex-shrink:0;}
.mp-top .who{font-size:17px;font-weight:800;color:var(--v-strong);}
.mp-top .sub{font-size:11.5px;color:var(--v-mute);margin-top:3px;}
.mp-top .rt{margin-left:auto;}
.mp-top .role{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px;
  background:var(--v-ok-bg);color:var(--v-ok);border:1px solid var(--v-ok-line);}
.mp-blk{border-top:1px solid var(--v-line);padding:18px 2px 4px;}
.mp-blk .ttl{font-size:11.5px;font-weight:700;color:var(--v-mute);margin-bottom:11px;}
.ver{text-align:center;font-size:11px;color:var(--v-ph);padding:26px 0 16px;line-height:1.7;}
#outBtn{margin-bottom:4px;}

.log-r{padding:12px 2px;border-top:1px solid var(--v-line);font-size:12.5px;}
.log-r:first-child{border-top:none;}
.log-r .l1{display:flex;gap:8px;align-items:baseline;}
.log-r .l1 b{color:var(--v-txt);}
.log-r .t{font-size:11px;color:var(--v-ph);font-variant-numeric:tabular-nums;margin-left:auto;
  white-space:nowrap;}
.log-r .l2{font-size:11.5px;color:var(--v-mute);margin-top:3px;word-break:break-all;}
/* ⚠️ 이름을 .empty 로 바꿨습니다.
   예전 이름(.note)은 주의 상자(.box.note)와 겹쳐서,
   상자에 가운데 정렬과 큰 여백이 몰래 덧붙었습니다.
   그래서 [발주 검토]와 [재고 미확인]의 간격이 달라 보였습니다. */
.empty{font-size:12px;color:var(--v-mute);text-align:center;padding:22px 14px;line-height:1.7;}
.empty.err{color:var(--v-danger);}

/* ── 워터마크 ─────────────────────────────────────
   캡쳐를 막을 수는 없으므로, 캡쳐된 이미지에 누가 언제 열었는지가

#wm{position:fixed;inset:0;pointer-events:none;z-index:9000;overflow:hidden;display:none;}
#wm span{position:absolute;white-space:nowrap;font-size:13px;font-weight:700;
  color:var(--v-wm);opacity:var(--wm-op);transform:rotate(-30deg);}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

<script>
/* ══════════════════════════════════════════════════════
   버던_재고 v6.3
   서버(Apps Script)와 주고받는 규격은 v5.1 과 같습니다.
   바뀐 것은 화면뿐입니다.
   ══════════════════════════════════════════════════════ */

/* Apps Script 웹앱 URL. 재배포해서 URL 이 바뀌면 이 줄만 고치면 된다. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSpg7_qMtWB-5TRqETUGHmic_be-bf-sUesKwekm0G8Lg6Q7uzyNmgcb8OW9JU8Zv-/exec";

const APP_VER  = 'v6.3';
/* 로고 · 공통 코어 저장소에 둡니다. 3개 앱이 같은 주소를 봅니다.
   로고를 바꾸면 ?v= 숫자만 올리면 캐시가 갈립니다. */
const LOGO = {
  light: 'https://verdan2024.github.io/verdan-core/logo-light.png?v=1',  /* 어두운 배경용 */
  dark : 'https://verdan2024.github.io/verdan-core/logo-dark.png?v=1'    /* 밝은 배경용 */
};
const STORE    = { pw:'verdan_pw', user:'verdan_user', theme:'verdan_theme' };
const LEGACY   = ['bujae_pw'];
/* 읽기는 빨리 포기하고 쓰기는 끝까지 기다린다.
   실패 대가가 다르기 때문이다 — 읽기는 다시 부르면 되지만 쓰기는 중복 위험이 있다. */
const TIMEOUT  = { read:12000, write:30000 };
const RECHECK  = 30000;
const THRESH   = 5;      /* 헤더 접힘 임계값 — 실기기에서 조정 */

/* 권한표 — 서버의 ROLES 와 짝을 맞춘다 */
const PERM = {
  admin : { label:'관리자', log:true,  vendor:true,  access:true  },
  staff : { label:'담당자', log:true,  vendor:true,  access:false },
  guest : { label:'게스트', log:false, vendor:false, access:false }
};
const NOPERM = { label:'—', log:false, vendor:false, access:false };

/* 카테고리 — 이 배열만 고치면 항목이 늘고 줄어듭니다 */
const LINKS = [
  {t:'VERDAN',    d:'홈페이지',    u:'https://verdan.co.kr'},
  {t:'MUSINSA',   d:'무신사',      u:'https://www.musinsa.com'},
  {t:'29CM',      d:'29CM',        u:'https://www.29cm.co.kr'},
  {t:'INSTAGRAM', d:'인스타그램',  u:'https://www.instagram.com'},
  {t:'MAGAZINE',  d:'버던 매거진', u:'https://verdan.co.kr'}
];

/* 발주 알림을 띄우지 않는 분류.
   원단은 생산할 때마다 발주하는 물건이라 재고 0이 정상 상태다.
   그대로 두면 매번 빨간 점이 떠서 정작 봐야 할 품목이 묻힌다. */
const NO_ALERT = ['원단'];

/* 분류 구획. 새 분류가 생겨도 여기에 한 줄 더하면 된다. */
const CATS = [
  { k:'생산', t:'생산 부자재', dot:'d4' },
  { k:'출고', t:'출고 부자재', dot:'ok' },
  { k:'원단', t:'원단',        dot:'d2' }
];

/* ── 상태 ─────────────────────────────────────────── */
let PW='', USER='', ROLE='', DATA=null, FEAT=null;
let PAGE='p1', LASTMAIN='p1', NAV='home', LOGVIEW='access';
let LOGS=[], logsLoaded=false, BUSY=false, LAST=0;
/* ⚠️ 스플래시가 떠 있는지. canvas() 가 참조하므로 반드시 위에서 선언합니다.
   const·let 은 끌어올려지지 않아, 아래에 두면 파일이 로드 즉시 죽습니다. */
let SPLASH_ON = true;
const IDEM = {};   /* 멱등키 — 같은 작업을 다시 눌러도 서버가 중복을 걸러낸다 */

/* ── 작은 도구 ────────────────────────────────────── */
const $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(v){
  if(v===''||v===null||v===undefined) return null;
  const x = Number(v);
  return isNaN(x) ? null : x;
}
function n(v){ const x=num(v); return x===null ? '—' : x.toLocaleString('ko-KR'); }
function setHTML(id,h){ const e=$(id); if(e) e.innerHTML=h; }
function setVal(id,v){ const e=$(id); if(e) e.value=v; }

function store(k,v){
  try{
    if(v===undefined) return localStorage.getItem(k);
    if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);
  }catch(e){ return null; }
}

/* ── 아이콘 (이모지 대신 단색 SVG) ────────────────── */
const ICON = {
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 3 21 9 15 9"/>',
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.6V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.6"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
  down:'<polyline points="6 9 12 15 18 9"/>',
  chev:'<polyline points="9 6 15 12 9 18"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'
};
function ic(name,size){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round"'+
    (size?' style="width:'+size+'px;height:'+size+'px"':'')+'>'+ICON[name]+'</svg>';
}

/* ── 테마 — 로그인 정보가 아니라 개인 취향이므로 로그아웃해도 유지 ──
   스플래시보다 먼저 적용합니다. 라이트로 떴다가 다크로 바뀌면 눈이 부십니다. */
let THEME = store(STORE.theme) || 'light';
applyTheme(THEME);

function applyTheme(v){
  THEME = v;
  document.documentElement.dataset.theme = v;
  if(typeof canvas === 'function') canvas();
  /* 스플래시와 헤더는 언제나 어두운 배경이라 밝은 로고를 씁니다.
     로그인 화면만 배경이 테마를 따라가므로 로고도 함께 바꿉니다. */
  const gl = $('gateLogo');
  if(gl) gl.src = (v==='dark') ? LOGO.light : LOGO.dark;
}

/* ── 권한 ─────────────────────────────────────────
   서버가 모르는 role 을 보내도 권한이 닫히는 쪽으로 떨어집니다. */
function perm(){ return PERM[ROLE] || NOPERM; }
function can(k){
  /* 서버가 features 로 "그 기능 자체가 없다"고 하면 권한과 무관하게 닫습니다 */
  if(FEAT && FEAT[k]===false) return false;
  return !!perm()[k];
}

/* ── 통신 ─────────────────────────────────────────── */
async function api(params, opt){
  opt = opt || {};
  const q = new URLSearchParams();
  q.set('key', PW); q.set('user', USER);
  Object.keys(params||{}).forEach(function(k){
    if(params[k]!==undefined && params[k]!==null) q.set(k, params[k]);
  });
  if(opt.idem){
    if(!IDEM[opt.idem]) IDEM[opt.idem] = 'R'+Date.now()+Math.random().toString(36).slice(2,8);
    q.set('reqId', IDEM[opt.idem]);
  }
  const ms = (opt.mode==='write') ? TIMEOUT.write : TIMEOUT.read;
  const ctl = new AbortController();
  const timer = setTimeout(function(){ ctl.abort(); }, ms);
  try{
    const res = await fetch(SCRIPT_URL+'?'+q.toString(), { method:'GET', signal:ctl.signal });
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
function isTimeout(e){ return e && (e.name==='AbortError' || /aborted/i.test(String(e.message))); }
function failMsg(e, tail){
  /* 시간 초과는 실패가 아니라 "모름"입니다. 서버는 계속 실행 중일 수 있습니다.
     그래서 "다시 시도하세요"가 아니라 확인부터 안내합니다. */
  return isTimeout(e)
    ? ('응답을 받지 못했습니다. ' + (tail || '반영 여부를 먼저 확인하세요.'))
    : ('통신에 실패했습니다. ' + (tail || '잠시 후 다시 시도하세요.'));
}

/* ── 화면 높이 · 키보드 ────────────────────────────
   iOS 는 키보드가 올라올 때 두 가지를 합니다.
     ① 보이는 높이를 줄인다      → visualViewport.height
     ② 화면 전체를 위로 밀어올린다 → visualViewport.offsetTop
   ①만큼 body 높이를 줄이고, ②만큼 도로 내려 제자리에 붙입니다.

   ⚠️ offsetTop 은 키보드 때문에만 변하지 않습니다. 손가락으로 화면을
      당길 때도 변합니다. 무조건 따라가면 화면이 손가락을 따라다닙니다.
      "화면이 120px 넘게 줄었을 때 = 키보드" 일 때만 보정합니다. */
function keyboardOpen(){
  const vv = window.visualViewport;
  return !!vv && (window.innerHeight - vv.height > 120);
}
function applyViewportHeight(){
  const vv = window.visualViewport;
  const b  = document.body.style;
  if(keyboardOpen()){
    /* 키보드가 올라온 동안에만 높이를 직접 잡습니다.
       ①만큼 줄이고 ②(offsetTop)만큼 도로 내려 제자리에 붙입니다. */
    b.bottom = 'auto';
    b.height = vv.height + 'px';
    b.transform = vv.offsetTop ? 'translateY(' + vv.offsetTop + 'px)' : 'none';
  }else{
    /* 평소에는 CSS 의 inset:0 에 맡깁니다. 계산하지 않는 것이 가장 정확합니다. */
    b.bottom = '';
    b.height = '';
    b.transform = 'none';
  }
}
let vpT = null;
function applyViewportSoon(){ clearTimeout(vpT); vpT = setTimeout(applyViewportHeight, 60); }

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', applyViewportSoon);
  /* scroll 은 손가락으로 당길 때도 오므로 키보드가 올라와 있을 때만 반응합니다 */
  window.visualViewport.addEventListener('scroll', function(){
    if(keyboardOpen()) applyViewportSoon();
  });
}
window.addEventListener('resize', applyViewportHeight);
/* 키보드가 내려간 뒤 남은 자리를 정리합니다 */
document.addEventListener('focusout', function(){ setTimeout(applyViewportHeight, 300); });
applyViewportHeight();

/* ── 스플래시 → 로그인 또는 자동 로그인 ───────────── */
function ready(){ SPLASH_ON = false; canvas(); }

/* 지금 보고 있는 화면에 맞춰 문서 바탕색을 직접 칠합니다.
     스플래시 = 올리브 (아래까지 전부 초록)
     본 화면  = 하단 내비와 같은 색 (내비가 끝까지 이어져 보이도록)
     로그인   = 앱 배경색
   인라인 스타일이라 어떤 CSS 규칙보다 확실하게 적용됩니다. */
function tok(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function canvas(){
  /* 화면 아래 '앱 바깥' 자리의 색입니다.
     iOS 는 이 자리를 body 배경색으로 칠하므로 html 과 body 를 함께 넣습니다.
     ⚠️ 'var(--v-card)' 를 인라인으로 넣으면 무시되는 기기가 있어
        계산된 색값(#FFFFFF 같은)을 직접 넣습니다. */
  const c = SPLASH_ON ? '#30382A'
    : ($('app').classList.contains('on')
        ? (tok('--v-card') || '#FFFFFF')   /* 본 화면 — 하단 내비와 같은 색 */
        : (tok('--v-bg')   || '#F7F6F1')); /* 로그인 화면 */
  document.documentElement.style.background = c;
  document.body.style.background = c;
}

  if(!pw){ gmsg('비밀번호를 입력하세요.'); return; }
  const btn=$('loginBtn'); btn.disabled=true;
  gmsg('접속 중입니다. 잠시만 기다려주세요.', true);
  PW = pw; USER = nm;

/* ── 헤더 접힘 · 무신사 방식 ──────────────────────── */
let lastY=0, ticking=false;
function measure(){
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight+'px');
  fitBottom();
}

/* 화면 아래에 앱 바깥으로 남는 자리(gap)를 재고,
   그만큼 하단 내비 안쪽 여백을 덜어냅니다.
   바깥 자리는 canvas() 가 내비와 같은 색으로 칠하므로 이어져 보입니다. */
function fitBottom(){
  let safe = 0;
  try{
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;visibility:hidden;'+
      'pointer-events:none;height:env(safe-area-inset-bottom)';
    document.body.appendChild(probe);
    safe = probe.offsetHeight;
    probe.remove();
  }catch(e){}
  const scr = (window.screen && window.screen.height) ? window.screen.height : window.innerHeight;
  const gap = Math.max(0, scr - window.innerHeight);
  document.documentElement.style.setProperty('--navpad', Math.max(8, safe - gap) + 'px');
}
window.addEventListener('resize', function(){ measure(); if(PW) watermark(); });
function onScroll(e){
  const el = e.currentTarget;
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    const y = el.scrollTop, hh = $('header').offsetHeight, d = y - lastY;
    if(y <= 0)                     setUp(false);
    else if(y > hh && d > THRESH)  setUp(true);
    else if(d < -THRESH)           setUp(false);
    lastY = y; ticking = false;
  });
}
function setUp(on){ $('chrome').classList.toggle('up', on); }

function go(id){

  $('tabs').style.display = (id==='p9') ? 'none' : 'flex';
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.page===id);
  });
  document.querySelectorAll('.page').forEach(function(p){
    p.classList.toggle('on', p.id===id);
  });
  /* 탭을 옮기면 헤더는 펼친 상태로 초기화합니다 */
  setUp(false); lastY = 0;
  const cur=$(id); if(cur) cur.scrollTop = 0;
  if(id==='p9' && can('access')) loadLogs(false);
}

/* ── 제품 재고 (조회 전용) ────────────────────────── */
function 디자인명(name){
  const s = String(name).replace(/^\[[^\]]*\]\s*/, '');   /* [REFURB] · [협찬] 제거 */
  const i = s.indexOf('_');
  return i>0 ? s.substring(0,i) : s;
}
function 합(a){ return a.reduce(function(s,x){ return s + (Number(x.tot)||0); }, 0); }

function 제품표(rows, 상품명표시){
  const body = rows.map(function(x){
    const zero = x.tot<=0;
    return '<tr><td><span class="nm">'+esc(x.opt || 디자인명(x.name))+'</span>'+
      '<div class="sub2">'+esc(상품명표시 ? x.name : x.code)+'</div></td>'+
      '<td>'+n(x.wh)+'</td><td>'+n(x.ff)+'</td>'+
      '<td class="'+(zero?'dg':'')+'">'+(zero ? '품절' : n(x.tot))+'</td></tr>';
  }).join('');
  return '<div class="tbl"><table><thead><tr>'+
    '<th>옵션</th><th>창고</th><th>풀필</th><th>총</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function 접기(title, cnt, inner){
  return '<details><summary><span class="chev">'+ic('chev',13)+'</span>'+esc(title)+
    '<span class="cnt">'+esc(cnt)+'</span></summary>'+inner+'</details>';
}

function renderProducts(){
  const D = DATA;
  const P = (D && D.products) ? D.products : null;

  if(!P || !P.ok){
    setHTML('prodBody', '<div class="box note"><div class="hd">'+
      '<span class="dot"></span>제품 재고를 불러오지 못했습니다</div><div class="bd">'+
      ((P && P.msg) ? esc(P.msg)+'<br>' : '')+
      '재고관리_메인 파일의 접근 권한을 확인하세요.</div></div>');
    return;
  }

  const items = P.items || [];
  const 정상 = items.filter(function(x){ return x.kind==='정상품'; });
  /* 리퍼브·협찬은 재고가 있는 것만 — 0은 볼 이유가 없다 */
  const 리퍼브 = items.filter(function(x){ return String(x.kind).indexOf('리퍼브')>=0 && x.tot>0; });
  const 협찬  = items.filter(function(x){ return String(x.kind).indexOf('협찬')>=0  && x.tot>0; });

  if(!정상.length){
    setHTML('prodBody','<div class="empty">제품 데이터가 없습니다.</div>');
    return;
  }

  let h = '<div class="summary"><span class="big">'+n(합(정상))+'</span>'+
    '<span class="lb">개 · 정상품 '+정상.length+'종</span></div>';

  /* 디자인별 묶음 — 원본 순서를 따른다 */
  const groups=[];
  정상.forEach(function(x){
    const d = 디자인명(x.name);
    let g=null;
    for(let i=0;i<groups.length;i++){ if(groups[i].name===d){ g=groups[i]; break; } }
    if(!g){ g={name:d,rows:[]}; groups.push(g); }
    g.rows.push(x);
  });
  groups.forEach(function(g){
    h += '<div class="sec">'+esc(g.name)+'<span class="cnt">'+n(합(g.rows))+'개</span></div>'+
      제품표(g.rows,false);
  });

  /* 품절 알림 — 정상품 아래, 리퍼브 위 */
  const 품절 = 정상.filter(function(x){ return x.tot<=0; });
  if(품절.length){
    h += '<div class="box danger"><div class="hd"><span class="dot danger"></span>'+
      '품절 '+품절.length+'종</div><div class="bd">'+
      품절.map(function(x){ return esc(디자인명(x.name)+' · '+(x.opt||'')); }).join('<br>')+
      '</div></div>';
  }

  if(리퍼브.length) h += 접기('리퍼브 제품', n(합(리퍼브))+'개', 제품표(리퍼브,true));
  if(협찬.length)   h += 접기('협찬 제품',   n(합(협찬))+'개',   제품표(협찬,true));

  h += '<div class="foot-note">· 재고관리_메인 시트를 그대로 읽습니다. 앱에서는 수정할 수 없습니다.<br>'+
       '· 창고는 자사 보관, 풀필은 위탁 보관 수량입니다.<br>'+
       '· 리퍼브·협찬은 재고가 있는 것만 표시합니다.</div>';
  setHTML('prodBody', h);
}

/* ── 부자재 재고 ──────────────────────────────────── */
function renderMaterials(){
  const D = DATA; if(!D) return;
  const mats = D.materials || [];
  let h='';
  CATS.forEach(function(o){
    h += 구획(o, mats.filter(function(m){ return m.cat===o.k; }));
  });
  /* 분류가 비었거나 목록에 없는 값이면 조용히 사라지지 않도록 따로 모은다 */
  const rest = mats.filter(function(m){
    return !CATS.some(function(o){ return o.k===m.cat; });
  });
  if(rest.length) h += 구획({t:'분류 미지정',dot:'mute'}, rest);

  setHTML('matBody', h + 발주알림() + 수량안내());
}

function 구획(o, list){
  if(!list.length) return '';
  const rows = list.map(function(m){
    const id = 'ven_'+String(m.code).replace(/[^A-Za-z0-9]/g,'_');
    const cell = m.sup
      ? '<span class="lnk" onclick="toggleVen(\''+esc(id)+'\')">'+esc(m.sup)+'</span>'
      : '<span class="muted">—</span>';
    const stock = num(m.stock);
    return '<tr><td><span class="nm">'+esc(m.name)+'</span>'+
        '<div class="sub2">'+esc(m.code)+'</div></td>'+
      '<td>'+(stock===null ? '<span class="muted">미확인</span>' : n(stock))+'</td>'+
      '<td>'+cell+'</td></tr>'+
      '<tr id="'+esc(id)+'" style="display:none"><td colspan="3" class="vd">'+거래처(m)+'</td></tr>';
  }).join('');
  return '<div class="sec"><span class="dot '+o.dot+'"></span>'+esc(o.t)+
    '<span class="cnt">'+list.length+'종</span></div>'+
    '<div class="tbl"><table><thead><tr><th>부자재</th><th>수량</th><th>거래처</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

function 거래처(m){
  const v = (DATA.vendors||[]).filter(function(x){ return x.vcode===m.vcode; })[0];
  if(!v) return '<span class="sub2">거래처마스터에 '+esc(m.vcode||'코드 없음')+' 정보가 없습니다.</span>';

  /* 담당자 · 연락처 → 홍길동 / 010-0000-0000 */
  const who=[];
  if(v.person) who.push(esc(v.person));
  if(v.tel) who.push('<a href="tel:'+esc(String(v.tel).replace(/[^0-9+]/g,''))+'">'+esc(v.tel)+'</a>');
  /* MOQ · 단가 → 1,000 / 8원 */
  const buy=[];
  if(num(m.moq))   buy.push(n(m.moq));
  if(num(m.price)) buy.push(n(m.price)+'원');

  const r = function(k,val){ return '<div class="k">'+k+'</div><div>'+val+'</div>'; };
  return '<div class="row">'+
    r('거래처코드', esc(v.vcode))+
    r('거래처명',   esc(v.name))+
    r('상세스펙',   m.spec ? esc(m.spec)
      : '<span class="dg">미등록 — 공급품목 시트에 입력하세요</span>')+
    r('담당자·연락처', who.length ? who.join(' / ') : '—')+
    r('URL', v.url ? '<a href="'+esc(v.url)+'" target="_blank" rel="noopener">링크 열기</a>' : '—')+
    r('MOQ · 단가', buy.length ? buy.join(' / ') : '—')+
    r('리드타임', num(m.lead) ? n(m.lead)+'일' : '—')+
    r('발주 방법', m.method ? esc(m.method) : '—')+
    '</div>';
}
function toggleVen(id){
  const el=$(id);
  if(el) el.style.display = (el.style.display==='none') ? 'table-row' : 'none';
}

/* 표에서 신호등 열을 뺐으므로, 발주가 필요한 것만 따로 알립니다 */
function 발주알림(){
  const need = (DATA.materials||[]).filter(function(m){
    if(NO_ALERT.indexOf(m.cat)>=0) return false;
    return m.state && String(m.state).indexOf('🔴')>=0;
  });
  if(!need.length) return '';
  return '<div class="box danger"><div class="hd"><span class="dot danger"></span>'+
    '발주 필요 '+need.length+'종</div><div class="bd">'+
    need.map(function(m){ return esc(m.name)+(m.sup ? ' · '+esc(m.sup) : ''); }).join('<br>')+
    '</div></div>';
}

function 수량안내(){
  const mats = DATA.materials||[];
  const un = mats.filter(function(m){ return m.fix==='미확인'; });
  const js = mats.filter(function(m){ return m.fix==='잠정'; });
  let h='';
  if(un.length) h += '<div class="box note"><div class="hd"><span class="dot mute"></span>'+
    '수량 미확인</div><div class="bd">'+un.map(function(m){ return esc(m.name); }).join(', ')+
    '<br>확인 후 시트의 기초재고·기준일·재고확정을 채우세요.</div></div>';
  if(js.length) h += '<div class="box note"><div class="hd"><span class="dot warn"></span>'+
    '잠정 수량</div><div class="bd">'+js.map(function(m){ return esc(m.name); }).join(', ')+
    ' · 실사 후 [확정]으로 변경하세요.</div></div>';
  return h;
}

/* ── 생산 계산 ────────────────────────────────────── */
function calc(){
  const D = DATA; if(!D) return;
  const dcode = $('cDesign').value;
  const qty = parseInt($('cQty').value,10);
  if(!dcode || !qty || qty<=0){
    setHTML('calcBody','<div class="box note">제품과 생산 수량을 입력하세요.</div>'); return;
  }
  const lines = (D.bom||[]).filter(function(b){ return b.dcode===dcode; });
  if(!lines.length){
    setHTML('calcBody','<div class="box note">이 제품의 BOM이 없습니다.</div>'); return;
  }

  const items = lines.map(function(b){
    const m = (D.materials||[]).filter(function(x){ return x.code===b.code; })[0] || {};
    const need  = Math.ceil((b.real || b.qty) * qty);
    const stock = num(m.stock);
    const rem   = stock===null ? null : stock-need;
    const mon   = num(m.monthly) || 0;
    const moq   = num(m.moq) || 1;
    /* 잔여가 3개월치에 못 미치면 그 부족분만 MOQ 단위로 올림 (이중 가산 없음) */
    const lack  = (rem===null) ? null : Math.max(0, mon*3 - rem);
    const order = (lack && lack>0) ? Math.ceil(lack/moq)*moq : 0;
    return { b:b, m:m, need:need, stock:stock, rem:rem, mon:mon, order:order,
      remMos:(rem===null||mon===0) ? null : Math.round(rem/mon*10)/10 };
  });

  const rows = items.map(function(it){
    let st, dot, cls='';
    if(it.rem===null){ st='미확인'; dot='mute'; }
    else if(it.rem<0){ st='부족'; dot='danger'; cls='dg'; }
    else if(it.mon===0){ st='소요 미상'; dot='mute'; }
    else if(it.remMos<3){ st='발주 필요'; dot='danger'; cls='dg'; }
    else if(it.remMos<12){ st='정상'; dot='ok'; }
    else if(it.remMos<24){ st='여유'; dot='warn'; }
    else { st='과잉'; dot='d3'; }
    return '<tr><td><span class="nm">'+esc(it.b.name)+'</span>'+
      '<div class="sub2">'+esc(it.b.owner)+
        (it.b.defect>0 ? ' · 불량 '+Math.round(it.b.defect*100)+'%' : '')+'</div></td>'+
      '<td>'+n(it.stock)+'</td><td>'+n(it.need)+'</td>'+
      '<td class="'+cls+'">'+n(it.rem)+'</td>'+
      '<td style="white-space:nowrap"><span class="dot '+dot+'" style="margin-right:5px"></span>'+
        '<span style="font-size:11.5px">'+st+'</span></td></tr>';
  }).join('');

  const short = items.filter(function(it){ return it.order>0 || (it.rem!==null && it.rem<0); });
  let alertHtml;
  if(short.length){
    alertHtml = '<div class="box danger"><div class="hd"><span class="dot danger"></span>'+
      '발주 검토 '+short.length+'종</div><div class="bd">'+
      short.map(function(it){
        const price = num(it.m.price);
        return '<div><b>'+esc(it.b.name)+'</b><br>'+
          '생산 후 잔여 '+n(it.rem)+'개'+
          (it.remMos!==null ? ' (약 '+it.remMos+'개월치)' : '')+'<br>'+
          '권장 발주 '+n(it.order)+'개 · MOQ '+n(it.m.moq)+
          (it.m.sup ? ' · '+esc(it.m.sup) : '')+'<br>'+
          '<span style="opacity:.75">'+
          (price ? '예상 '+n(it.order*price)+'원 · ' : '')+
          '리드타임 '+n(it.m.lead)+'일</span></div>';
      }).join('')+'</div></div>';
  }else{
    alertHtml = '<div class="box ok"><div class="hd"><span class="dot ok"></span>'+
      '생산 후에도 3개월치 이상 남습니다</div>'+
      '<div class="bd">발주가 필요하지 않습니다.</div></div>';
  }

  const un = items.filter(function(it){ return it.rem===null; });
  const unNote = un.length ? '<div class="box note"><div class="hd">'+
    '<span class="dot"></span>재고 미확인</div><div class="bd">'+
    un.map(function(it){ return esc(it.b.name); }).join(', ')+
    ' 는 계산에서 빠졌습니다.</div></div>' : '';

  setHTML('calcBody',
    '<div class="tbl"><table><thead><tr><th>부자재</th><th>현재고</th><th>필요</th>'+
    '<th>잔여</th><th style="text-align:left">상태</th></tr></thead><tbody>'+rows+
    '</tbody></table></div>'+alertHtml+unNote+
    '<div class="foot-note">· 필요 수량은 BOM 실소요량(불량률 포함) × 생산 수량입니다.<br>'+
    '· 발주 권장은 생산 후 잔여가 3개월치에 못 미칠 때만 계산됩니다.</div>');
}

/* ── 입출고 등록 ──────────────────────────────────── */
async function submitLog(){
  if(BUSY) return;
  const p = {
    action:'log',
    code:   $('fCode').value,
    kind:   $('fKind').value,
    reason: $('fReason').value,
    qty:    $('fQty').value,
    ref:    $('fRef').value,
    memo:   $('fMemo').value
  };
  if(!p.code || !p.kind || !p.reason || !p.qty){
    lm('부자재·구분·사유·수량을 모두 입력하세요.', true); return;
  }
  const btn=$('logBtn');
  BUSY=true; btn.disabled=true; btn.textContent='등록 중...';
  lm('등록 중...', false);
  try{
    /* 같은 내용으로 다시 눌러도 서버가 중복을 걸러낼 수 있게 멱등키를 붙입니다 */
    const r = await api(p, { mode:'write', idem:'log:'+p.code+':'+p.kind+':'+p.qty+':'+p.ref });
    if(!r || !r.ok){ lm((r && r.msg) || '등록에 실패했습니다.', true); return; }
    setData(r);
    lm('등록했습니다.', false);
    ['fQty','fRef','fMemo'].forEach(function(id){ setVal(id,''); });
    /* 방금 남긴 기록이 접근로그에 반영되도록 다시 불러옵니다.
       열람 권한이 없는 담당자는 부를 필요가 없습니다(서버가 거부합니다). */
    if(can('access')) loadLogs(true).catch(function(){});
    setTimeout(function(){ NAV='home'; go('p1'); paintBottom(); lm('',false); }, 900);
  }catch(e){
    /* 시간 초과는 서버에 들어갔는지 알 수 없습니다. 중복 등록을 막기 위해
       무조건 재시도하라고 하지 않고 재고를 먼저 확인하도록 안내합니다. */
    lm(failMsg(e, '[재고] 탭에서 반영 여부를 먼저 확인하세요.'), true);
  }finally{
    BUSY=false; btn.disabled=false; btn.textContent='등록';
  }
}
function lm(t, err){
  const el=$('logMsg'); if(!el) return;
  el.textContent=t; el.className='msg'+(err?' err':' good');
}

/* ── 접근로그 (관리자) ────────────────────────────
   분류(kind)는 서버가 붙여 보냅니다.
     access : 로그인 성공 · 실패
     work   : 입출고 등록 · 중복 확인 · 권한거부 · 오류
     system : 자동 처리 → 화면에서 숨김
   시각은 서버가 한국시간 'yyyy-MM-dd HH:mm' 로 맞춰 보냅니다. */
async function loadLogs(force){
  if(!can('access')) return;
  if(logsLoaded && !force){ renderLogs(); return; }
  setHTML('logBody','<div class="empty">불러오는 중...</div>');
  try{
    const r = await api({ action:'access' });
    if(!r || !r.ok){
      setHTML('logBody','<div class="empty err">'+esc((r&&r.msg)||'불러오지 못했습니다.')+'</div>');
      return;
    }
    LOGS = (r.logs||[]).filter(function(x){ return x.kind!=='system'; });
    logsLoaded = true;
    renderLogs();
  }catch(e){
    setHTML('logBody','<div class="empty err">'+esc(failMsg(e,''))+'</div>');
  }
}

function renderLogs(){
  if(!can('access')) return;
  const rows = LOGS.filter(function(x){ return x.kind===LOGVIEW; });
  if(!rows.length){
    setHTML('logBody','<div class="empty">'+
      (LOGVIEW==='access' ? '접속 기록이 없습니다.' : '기록이 없습니다.')+'</div>');
    return;
  }
  setHTML('logBody', rows.map(function(r){
    const tail = (LOGVIEW==='access')
      ? (r.role || '')
      : (r.memo || '');
    return '<div class="log-r"><div class="l1"><b>'+esc(r.user||'—')+'</b>'+
      '<span class="t">'+esc(r.t||'')+'</span></div>'+
      '<div class="l2">'+esc(r.result||'')+(tail ? ' · '+esc(tail) : '')+'</div></div>';
  }).join(''));
}

/* ── 워터마크 ─────────────────────────────────────── */
function watermark(){
  const e=$('wm');
  if(!PW || !USER){ e.style.display='none'; e.innerHTML=''; return; }
  const d=new Date(), p=function(x){ return String(x).padStart(2,'0'); };
  const txt = USER+' · '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+
    ' '+p(d.getHours())+':'+p(d.getMinutes());
  let h='';
  for(let y=-120;y<window.innerHeight+200;y+=130)
    for(let x=-180;x<window.innerWidth+240;x+=210)
      h += '<span style="left:'+x+'px;top:'+y+'px">'+esc(txt)+'</span>';
  e.innerHTML=h; e.style.display='block';
}

/* ── 시작 ─────────────────────────────────────────
   ⚠️ 이 블록은 반드시 스크립트 맨 끝에 있어야 합니다.
      const 로 선언한 값(NAVS · LINKS 등)은 끌어올려지지 않아서,
      위쪽에서 부르면 "Cannot access before initialization" 으로
      파일이 통째로 죽습니다. 문법 검사로는 잡히지 않습니다. */
(function init(){
  try{
    buildIcons(); buildCat(); buildBottom(); bindAll();

    /* 기존 사용자가 다시 로그인하지 않도록 예전 저장 키도 본다 */
    let saved = store(STORE.pw);
    if(!saved){
      for(let i=0;i<LEGACY.length;i++){
        const v = store(LEGACY[i]);
        if(v){ saved = v; store(STORE.pw, v); break; }
      }
    }
    const savedUser = store(STORE.user) || '';
    setVal('nm', savedUser);

    if(saved){
      PW = saved; USER = savedUser || '(미입력)';
      autoLogin();
    }else{
      showGate();
    }
  }catch(e){
    /* 무슨 일이 있어도 로그인 화면은 떠야 합니다.
       빈 화면은 사용자가 손쓸 방법이 없습니다. */
    showGate();
    gmsg('화면을 여는 중 문제가 생겼습니다. ' + (e && e.message ? e.message : ''));
  }
})();

/* 마지막 안전장치 — 3초가 지나도 아무 화면도 없으면 로그인 화면을 띄웁니다 */
setTimeout(function(){
  if(!$('gate').classList.contains('on') && !$('app').classList.contains('on')) showGate();
}, 3000);
</script>
