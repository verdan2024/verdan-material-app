<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>버던_재고</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;background:#F5F6FA;
     min-height:100vh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;}

/* 로그인 */
#gate{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;}
#gate .box{width:100%;max-width:340px;background:#fff;border-radius:16px;padding:28px 24px;
     box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center;}
#gate .logo{font-size:34px;margin-bottom:10px;}
#gate h1{font-size:17px;color:#1A1A2E;margin-bottom:20px;}
#gate input{width:100%;padding:13px 16px;border:1px solid #E0E0E0;border-radius:10px;
     font-size:16px;margin-bottom:10px;font-family:inherit;background:#F8F8F8;}
#gate input:focus{outline:none;border-color:#9FA8DA;background:#fff;}
#gate button{width:100%;padding:13px;border:none;border-radius:10px;background:#1A1A2E;color:#fff;
     font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
#gateMsg{font-size:13px;color:#C0392B;margin-top:12px;min-height:18px;}
#gate .hint{font-size:11px;color:#AAA;margin-top:10px;line-height:1.6;}

/* 앱 */
#app{display:none;flex-direction:column;min-height:100vh;}
#header{background:#1A1A2E;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;}
#header .icon{width:36px;height:36px;border-radius:50%;background:#3F51B5;display:flex;
     align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
#header .title{font-weight:700;font-size:14px;}
#header .sub{font-size:11px;opacity:.6;margin-top:2px;}
#header .role{margin-left:auto;font-size:11px;background:#3F51B5;padding:3px 9px;border-radius:10px;
     white-space:nowrap;}
#tabs{display:flex;background:#fff;border-bottom:1px solid #EEE;}
#tabs button{flex:1;padding:12px 6px;border:none;background:none;font-size:13px;font-weight:600;
     color:#888;font-family:inherit;cursor:pointer;border-bottom:2px solid transparent;
     white-space:nowrap;}
#tabs button.on{color:#1A1A2E;border-bottom-color:#1A1A2E;}
.page{padding:16px;display:none;}
.seg{display:flex;gap:6px;background:#ECEDF2;border-radius:10px;padding:4px;margin-bottom:14px;}
.seg button{flex:1;padding:9px;border:none;border-radius:7px;background:none;font-size:13px;
     font-weight:700;color:#888;font-family:inherit;cursor:pointer;}
.seg button.on{background:#fff;color:#1A1A2E;box-shadow:0 1px 3px rgba(0,0,0,.10);}
details{margin-bottom:12px;}
details summary{cursor:pointer;font-size:12px;font-weight:700;padding:9px 12px;border-radius:8px;
     background:#F0F0F3;color:#555;list-style:none;}
details summary::-webkit-details-marker{display:none;}
details summary::before{content:'▸ ';}
details[open] summary::before{content:'▾ ';}
details .tbl-wrap{margin-top:8px;}
.lnk{color:#1976D2;font-weight:600;cursor:pointer;border-bottom:1px solid #BBDEFB;}
.vd{background:#FAFAFC;font-size:12px;line-height:2.0;}
.vd b{display:inline-block;min-width:96px;color:#999;font-weight:600;}
.vd a{color:#1976D2;}
.page.on{display:block;}

.card{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:14px;margin-bottom:12px;}
.card h3{font-size:13px;color:#1A1A2E;margin-bottom:10px;}
select,input.f,button.f{width:100%;padding:12px;border:1px solid #E0E0E0;border-radius:10px;
     font-size:16px;margin-bottom:9px;font-family:inherit;background:#fff;}
button.f{background:#1A1A2E;color:#fff;border:none;font-weight:700;cursor:pointer;}
button.ghost{background:#fff;color:#1A1A2E;border:1px solid #DDD;}

table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
th{padding:8px 6px;text-align:center;font-size:11px;font-weight:600;color:#555;
   background:#F5F5F5;border-bottom:2px solid #E0E0E0;white-space:nowrap;}
td{padding:8px 6px;border-bottom:1px solid #F0F0F0;}
.tbl-wrap{overflow-x:auto;border:1px solid #E8E8E8;border-radius:12px;margin-bottom:12px;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ctr{text-align:center;}
.sub2{font-size:11px;color:#999;}
.sec{font-size:12px;font-weight:700;padding:7px 11px;border-radius:8px;margin:14px 0 8px;}
.sec-prod{background:#E8EAF6;color:#1A237E;}
.sec-out{background:#E8F5E9;color:#1B5E20;}
.sec-fab{background:#EFEBE9;color:#4E342E;}
.sec-etc{background:#F0F0F3;color:#666;}
.danger{color:#C0392B;font-weight:700;}
.warn{color:#7D5A00;font-weight:600;}
.ok{color:#1B5E20;font-weight:600;}
.box-danger{background:#FDECEA;border:1px solid #FFCDD2;border-radius:10px;padding:12px 14px;
     margin-bottom:12px;font-size:13px;line-height:1.8;}
.box-ok{background:#E8F5E9;border:1px solid #A5D6A7;border-radius:10px;padding:11px 14px;
     margin-bottom:12px;font-size:13px;color:#1B5E20;}
.box-note{background:#FFFDE7;border:1px solid #FFE082;border-radius:10px;padding:11px 14px;
     margin-bottom:12px;font-size:12px;color:#7D5A00;line-height:1.7;}
.msg{font-size:13px;margin-top:8px;min-height:18px;}
.msg.err{color:#C0392B;} .msg.good{color:#1B5E20;}
.foot{font-size:11px;color:#AAA;text-align:center;padding:14px 0;}
</style>
</head>
<body>

<!-- ── 로그인 ───────────────────────────── -->
<div id="gate">
  <div class="box">
    <div class="logo">📦</div>
    <h1>버던_재고</h1>
    <input type="text" id="nm" placeholder="이름" autocomplete="name" maxlength="20"
           onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">확인</button>
    <div id="gateMsg"></div>
    <div class="hint">본인 이름을 입력하세요. 입출고 기록에 함께 남습니다.<br>v3.8 · 2026-08-08</div>
  </div>
</div>

<!-- ── 앱 ───────────────────────────────── -->
<div id="app">
  <div id="header">
    <div class="icon">📦</div>
    <div>
      <div class="title">버던_재고</div>
      <div class="sub" id="updated"></div>
    </div>
    <div class="role" id="roleBadge"></div>
  </div>

  <div id="tabs">
    <button id="t1" class="on" onclick="tab('p1')">재고</button>
    <button id="t2" onclick="tab('p2')">생산 계산</button>
    <button id="t3" onclick="tab('p3')" style="display:none">입출고</button>
    <button id="t4" onclick="tab('p4')" style="display:none">접근로그</button>
  </div>

  <!-- 재고 -->
  <div id="p1" class="page on">
    <div class="seg">
      <button id="sgP" class="on" onclick="stockView('prod')">제품</button>
      <button id="sgM" onclick="stockView('mat')">부자재</button>
    </div>
    <div id="prodBody"></div>
    <div id="stockBody" style="display:none"></div>
    <button class="f ghost" onclick="reload()">새로고침</button>
  </div>

  <!-- 생산 계산 -->
  <div id="p2" class="page">
    <div class="card">
      <h3>생산 계획</h3>
      <select id="cDesign"></select>
      <input class="f" type="number" id="cQty" placeholder="생산 수량" inputmode="numeric">
      <button class="f" onclick="calc()">계산</button>
    </div>
    <div id="calcBody"></div>
  </div>

  <!-- 입출고 -->
  <div id="p3" class="page">
    <div class="card">
      <h3>입출고 등록</h3>
      <select id="fCode"></select>
      <select id="fKind"></select>
      <select id="fReason"></select>
      <input class="f" type="number" id="fQty" placeholder="수량" inputmode="numeric">
      <div class="sub2" style="margin:-4px 0 10px">입고·출고는 양수만. 음수는 [조정]에서만.</div>
      <input class="f" type="text" id="fRef" placeholder="관련번호 (발주번호 · 로트 · 해당 월)">
      <input class="f" type="text" id="fMemo" placeholder="메모 (선택)">
      <button class="f" onclick="submitLog()">등록</button>
      <div class="msg" id="logMsg"></div>
    </div>
  </div>

  <!-- 접근로그 -->
  <div id="p4" class="page">
    <div id="accessBody"></div>
    <button class="f ghost" onclick="loadAccess()">새로고침</button>
  </div>

  <div class="foot">
    <button class="f ghost" style="width:auto;padding:9px 22px;font-size:12px"
            onclick="logout()">로그아웃</button>
    <div class="sub2" style="margin-top:10px">버던_재고 · v3.8</div>
  </div>
</div>

<script>
/* ⚠️ Apps Script 웹앱 URL (기존 것 그대로 두시면 됩니다) */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSpg7_qMtWB-5TRqETUGHmic_be-bf-sUesKwekm0G8Lg6Q7uzyNmgcb8OW9JU8Zv-/exec";

const PW_STORE = 'verdan_pw';
const NM_STORE = 'verdan_user';

/* 권한표 — 서버의 ROLES와 짝을 맞춘다 */
const PERM = {
  admin : { label:'관리자', log:true,  vendor:true,  access:true  },
  staff : { label:'담당자', log:true,  vendor:true,  access:false },
  guest : { label:'게스트', log:false, vendor:false, access:false }
};
const NOPERM = { label:'—', log:false, vendor:false, access:false };

let PW = '', USER = '', ROLE = '', D = null, accessLoaded = false;

/* ── 통신 ─────────────────────────────── */
async function api(params){
  const q = new URLSearchParams(Object.assign({ key: PW, user: USER }, params || {}));
  const res = await fetch(SCRIPT_URL + '?' + q.toString());
  return await res.json();
}

/* ── 로그인 ───────────────────────────── */
async function login(){
  const nm = document.getElementById('nm').value.trim();
  const pw = document.getElementById('pw').value.trim();
  if(!nm){ gm('이름을 입력하세요.'); return; }
  if(!pw){ gm('비밀번호를 입력하세요.'); return; }
  gm('확인 중...');
  PW = pw; USER = nm;
  try{
    const r = await api();
    if(!r.ok){ PW=''; USER=''; gm(r.msg || '비밀번호가 올바르지 않습니다.'); return; }
    try{
      localStorage.setItem(PW_STORE, pw);
      localStorage.setItem(NM_STORE, nm);
    }catch(e){}
    start(r);
  }catch(e){ PW=''; USER=''; gm('연결 실패: ' + e.message); }
}

function logout(){
  /* 구 버전 키까지 함께 지운다.
     예전 페이지가 캐시로 살아 있으면 그쪽 키로 자동 로그인되기 때문. */
  try{
    localStorage.removeItem(PW_STORE);
    localStorage.removeItem('bujae_pw');
  }catch(e){}                                          // 이름은 남겨 재입력을 줄인다
  PW=''; USER=''; ROLE=''; D=null; accessLoaded=false;
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('pw').value='';
  /* 권한 흔적 제거 — 로그인 때 다시 켠다 */
  ['t3','t4'].forEach(function(id){
    document.getElementById(id).style.display='none';
  });
  document.getElementById('roleBadge').textContent='';
  ['fCode','fKind','fReason','cDesign'].forEach(function(id){
    document.getElementById(id).innerHTML='';
  });
  ['fQty','fRef','fMemo','cQty'].forEach(function(id){
    document.getElementById(id).value='';
  });
  ['prodBody','stockBody','calcBody','accessBody'].forEach(function(id){
    document.getElementById(id).innerHTML='';
  });
  stockView('prod');
  lm('', false);
  tab('p1');
  gm('');
}

function gm(t){ document.getElementById('gateMsg').textContent = t; }

/* ── 화면 구성 ────────────────────────── */
function start(r){
  D = r; ROLE = r.role;
  const perm = PERM[ROLE] || NOPERM;

  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('roleBadge').textContent = perm.label;
  document.getElementById('updated').textContent = '갱신 ' + r.updated;

  /* 탭 노출 — 권한마다 매번 명시적으로 켜고 끈다 */
  document.getElementById('t3').style.display = perm.log    ? 'block' : 'none';
  document.getElementById('t4').style.display = perm.access ? 'block' : 'none';

  /* 생산 계산 */
  const designs = [];
  r.bom.forEach(function(b){
    if(!designs.some(function(d){ return d.code===b.dcode; }))
      designs.push({ code:b.dcode, name:b.dname });
  });
  fill('cDesign', designs.map(function(d){ return {v:d.code, t:d.name}; }), '제품 선택');
  document.getElementById('cQty').value='';
  document.getElementById('calcBody').innerHTML='';

  /* 입출고 */
  if(perm.log){
    fill('fCode', r.materials.map(function(m){ return {v:m.code, t:m.code+' · '+m.name}; }), '부자재 선택');
    fill('fKind',   r.kinds.map(function(k){ return {v:k,t:k}; }),   '구분 선택');
    fill('fReason', r.reasons.map(function(k){ return {v:k,t:k}; }), '사유 선택');
  } else {
    ['fCode','fKind','fReason'].forEach(function(id){
      document.getElementById(id).innerHTML='';
    });
    ['fQty','fRef','fMemo'].forEach(function(id){
      document.getElementById(id).value='';
    });
    lm('', false);
  }

  /* 접근로그 — 탭을 열 때 불러온다 */
  accessLoaded = false;
  document.getElementById('accessBody').innerHTML='';

  renderProducts();
  renderStock();
  stockView('prod');
  tab('p1');
}

function fill(id, items, ph){
  document.getElementById(id).innerHTML =
    '<option value="">'+ph+'</option>' +
    items.map(function(i){ return '<option value="'+i.v+'">'+esc(i.t)+'</option>'; }).join('');
}

function tab(p){
  for(var i=1;i<=4;i++){
    var on = ('p'+i)===p;
    document.getElementById('p'+i).className = 'page' + (on?' on':'');
    document.getElementById('t'+i).className = on ? 'on' : '';
  }
  if(p==='p4' && !accessLoaded) loadAccess();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function n(v){ return (v===null||v===''||v===undefined||isNaN(v)) ? '—' : Number(v).toLocaleString('ko-KR'); }
function num(v){ const x = Number(v); return isNaN(x) ? null : x; }

/* ── 재고: 제품 | 부자재 전환 ─────────── */
function stockView(v){
  const isProd = (v === 'prod');
  document.getElementById('prodBody').style.display  = isProd ? 'block' : 'none';
  document.getElementById('stockBody').style.display = isProd ? 'none'  : 'block';
  document.getElementById('sgP').className = isProd ? 'on' : '';
  document.getElementById('sgM').className = isProd ? ''   : 'on';
}

/* ── 제품 재고 (조회 전용) ────────────── */
function 디자인명(name){
  const n = String(name).replace(/^\[[^\]]*\]\s*/, '');   // [REFURB] · [협찬] 제거
  const i = n.indexOf('_');
  return i > 0 ? n.substring(0, i) : n;
}

function 제품표(rows, 상품명표시){
  const body = rows.map(function(x){
    const zero = x.tot <= 0;
    const sub = 상품명표시 ? esc(x.name) : esc(x.code);
    return '<tr>'+
      '<td><b>'+esc(x.opt || 디자인명(x.name))+'</b>'+
        '<div class="sub2">'+sub+'</div></td>'+
      '<td class="num">'+n(x.wh)+'</td>'+
      '<td class="num">'+n(x.ff)+'</td>'+
      '<td class="num '+(zero?'danger':'')+'">'+(zero ? '품절' : n(x.tot))+'</td></tr>';
  }).join('');
  return '<div class="tbl-wrap"><table><thead><tr>'+
    '<th style="text-align:left">옵션</th><th>창고</th><th>풀필</th><th>총</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}

function renderProducts(){
  const box = document.getElementById('prodBody');
  const P = (D && D.products) ? D.products : null;

  if(!P || !P.ok){
    box.innerHTML = '<div class="box-note">제품 재고를 불러오지 못했습니다.'+
      ((P && P.msg) ? '<br>'+esc(P.msg) : '')+
      '<br>재고관리_메인 파일의 접근 권한을 확인하세요.</div>';
    return;
  }

  const items = P.items || [];
  const 정상 = items.filter(function(x){ return x.kind === '정상품'; });
  /* 리퍼브·협찬은 재고가 있는 것만 — 0은 볼 이유가 없다 */
  const 리퍼브 = items.filter(function(x){ return x.kind.indexOf('리퍼브') >= 0 && x.tot > 0; });
  const 협찬  = items.filter(function(x){ return x.kind.indexOf('협찬')  >= 0 && x.tot > 0; });
  const 합 = function(a){ return a.reduce(function(s,x){ return s + x.tot; }, 0); };

  if(!정상.length){
    box.innerHTML = '<div class="box-note">제품 데이터가 없습니다.</div>';
    return;
  }

  let h = '<div class="box-ok">정상품 '+정상.length+'종 · 총 <b>'+n(합(정상))+'개</b></div>';

  /* 디자인별 묶음 — 원본 순서를 따른다 */
  const groups = [];
  정상.forEach(function(x){
    const d = 디자인명(x.name);
    let g = null;
    for(let i=0;i<groups.length;i++){ if(groups[i].name===d){ g=groups[i]; break; } }
    if(!g){ g = { name:d, rows:[] }; groups.push(g); }
    g.rows.push(x);
  });
  groups.forEach(function(g){
    h += '<div class="sec sec-prod">'+esc(g.name)+' · '+n(합(g.rows))+'개</div>' + 제품표(g.rows, false);
  });

  /* 품절 알림 — 정상품 아래, 리퍼브 위 */
  const 품절 = 정상.filter(function(x){ return x.tot <= 0; });
  if(품절.length){
    h += '<div class="box-note">🔴 <b>품절 '+품절.length+'종</b><br>'+
      품절.map(function(x){ return esc(디자인명(x.name)+' · '+(x.opt||'')); }).join('<br>')+
      '</div>';
  }

  if(리퍼브.length) h += '<details><summary>리퍼브 제품 · '+n(합(리퍼브))+'개</summary>'+제품표(리퍼브, true)+'</details>';
  if(협찬.length)   h += '<details><summary>협찬 제품 · '+n(합(협찬))+'개</summary>'+제품표(협찬, true)+'</details>';

  h += '<div class="sub2" style="line-height:1.7">· 재고관리_메인 시트를 그대로 읽습니다. 앱에서는 수정할 수 없습니다.<br>'+
       '· 창고는 자사 보관, 풀필은 위탁 보관 수량입니다.<br>'+
       '· 리퍼브·협찬은 재고가 있는 것만 표시합니다.</div>';
  box.innerHTML = h;
}

/* ── 부자재 재고 ──────────────────────── */
/* 발주 알림을 띄우지 않는 분류.
   원단은 생산할 때마다 발주하는 물건이라 재고 0이 정상 상태다.
   신호등을 그대로 두면 매번 🔴 이 떠서 정작 봐야 할 품목이 묻힌다. */
const NO_ALERT = ['원단'];

/* 분류 구획. 새 분류가 생겨도 아래 ORDER에 한 줄 더하면 됩니다. */
const CATS = [
  { k:'생산', t:'🔵 생산 부자재', c:'sec-prod' },
  { k:'출고', t:'🟢 출고 부자재', c:'sec-out'  },
  { k:'원단', t:'🟤 원단',        c:'sec-fab'  }
];

function renderStock(){
  let h = '';
  CATS.forEach(function(o){
    h += section(o.t, o.c, D.materials.filter(function(m){ return m.cat === o.k; }));
  });
  /* 분류가 비었거나 목록에 없는 값이면 조용히 사라지지 않도록 따로 모은다 */
  const rest = D.materials.filter(function(m){
    return !CATS.some(function(o){ return o.k === m.cat; });
  });
  if(rest.length) h += section('⚪ 분류 미지정','sec-etc',rest);

  document.getElementById('stockBody').innerHTML = h + 발주알림() + note();
}

function section(title, cls, list){
  if(!list.length) return '';
  const rows = list.map(function(m){
    const id = 'ven_' + m.code;
    const cell = m.sup
      ? '<span class="lnk" onclick="venToggle(\''+id+'\')">'+esc(m.sup)+'</span>'
      : '<span class="sub2">—</span>';
    return '<tr>'+
      '<td><b>'+esc(m.name)+'</b><div class="sub2">'+esc(m.code)+'</div></td>'+
      '<td class="num">'+n(m.stock)+'</td>'+
      '<td class="ctr" style="font-size:12px">'+cell+'</td></tr>'+
      '<tr id="'+id+'" style="display:none"><td colspan="3" class="vd">'+venCard(m)+'</td></tr>';
  }).join('');
  return '<div class="sec '+cls+'">'+title+'</div><div class="tbl-wrap"><table>'+
    '<thead><tr><th style="text-align:left">부자재</th><th>수량</th><th>거래처</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

function venToggle(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.display = (el.style.display === 'none') ? 'table-row' : 'none';
}

function venCard(m){
  const vcode = m.vcode;
  const v = (D.vendors || []).filter(function(x){ return x.vcode === vcode; })[0];
  if(!v) return '<span class="sub2">거래처마스터에 '+esc(vcode||'코드 없음')+' 정보가 없습니다.</span>';

  /* 담당자 · 연락처 → 홍길동 / 010-0000-0000 */
  const who = [];
  if(v.person) who.push(esc(v.person));
  if(v.tel) who.push('<a href="tel:'+esc(v.tel.replace(/[^0-9+]/g,''))+'">'+esc(v.tel)+'</a>');

  /* MOQ · 단가 → 1,000 / 8원 */
  const buy = [];
  if(num(m.moq))   buy.push(n(m.moq));
  if(num(m.price)) buy.push(n(m.price)+'원');

  return '<div><b>거래처코드</b> '+esc(v.vcode)+'</div>'+
    '<div><b>거래처명</b> '+esc(v.name)+'</div>'+
    '<div><b>상세스펙</b> '+(m.spec ? esc(m.spec)
      : '<span class="danger">미등록 — 공급품목 시트에 입력하세요</span>')+'</div>'+
    '<div><b>담당자 · 연락처</b> '+(who.length ? who.join(' / ') : '—')+'</div>'+
    '<div><b>URL</b> '+(v.url
      ? '<a href="'+esc(v.url)+'" target="_blank" rel="noopener">링크 열기</a>' : '—')+'</div>'+
    '<div><b>MOQ · 단가</b> '+(buy.length ? buy.join(' / ') : '—')+'</div>'+
    '<div><b>리드타임</b> '+(num(m.lead) ? n(m.lead)+'일' : '—')+'</div>'+
    '<div><b>발주 방법</b> '+(m.method ? esc(m.method) : '—')+'</div>';
}

/* 신호등 열을 뺐으므로, 발주가 필요한 것만 따로 알린다 */
function 발주알림(){
  const need = D.materials.filter(function(m){
    if(NO_ALERT.indexOf(m.cat) >= 0) return false;
    return m.state && m.state.indexOf('🔴') >= 0;
  });
  if(!need.length) return '';
  return '<div class="box-danger"><b style="color:#C0392B">🔴 발주 필요 '+need.length+'종</b><br>'+
    need.map(function(m){ return esc(m.name)+(m.sup ? ' · '+esc(m.sup) : ''); }).join('<br>')+
    '</div>';
}

function note(){
  const un = D.materials.filter(function(m){ return m.fix==='미확인'; });
  const js = D.materials.filter(function(m){ return m.fix==='잠정'; });
  let h = '';
  if(un.length) h += '<div class="box-note">⚪ <b>수량 미확인</b> — '+
      un.map(function(m){ return esc(m.name); }).join(', ')+
      '<br>확인 후 시트의 기초재고·기준일·재고확정을 채우세요.</div>';
  if(js.length) h += '<div class="box-note">🟠 <b>잠정 수량</b> — '+
      js.map(function(m){ return esc(m.name); }).join(', ')+' · 실사 후 [확정]으로 변경하세요.</div>';
  return h;
}

/* ── 생산 계산 ────────────────────────── */
function calc(){
  const dcode = document.getElementById('cDesign').value;
  const qty   = parseInt(document.getElementById('cQty').value, 10);
  const body  = document.getElementById('calcBody');
  if(!dcode || !qty || qty<=0){
    body.innerHTML = '<div class="box-note">제품과 생산 수량을 입력하세요.</div>'; return;
  }

  const lines = D.bom.filter(function(b){ return b.dcode===dcode; });
  if(!lines.length){ body.innerHTML = '<div class="box-note">이 제품의 BOM이 없습니다.</div>'; return; }

  const items = lines.map(function(b){
    const m = D.materials.filter(function(x){ return x.code===b.code; })[0] || {};
    const need  = Math.ceil((b.real || b.qty) * qty);
    const stock = num(m.stock);
    const rem   = stock===null ? null : stock - need;
    const mon   = num(m.monthly) || 0;
    const moq   = num(m.moq) || 1;
    // 잔여가 3개월치에 못 미치면 그 부족분만 MOQ 단위로 올림 (이중 가산 없음)
    const target= mon * 3;
    const lack  = (rem===null) ? null : Math.max(0, target - rem);
    const order = (lack && lack>0) ? Math.ceil(lack/moq)*moq : 0;
    return { b:b, m:m, need:need, stock:stock, rem:rem, mon:mon, order:order,
             remMos: (rem===null||mon===0) ? null : Math.round(rem/mon*10)/10 };
  });

  const rows = items.map(function(it){
    let st, cls='';
    if(it.rem===null){ st='⚪ 미확인'; }
    else if(it.rem < 0){ st='🔴 부족'; cls='danger'; }
    else if(it.mon===0){ st='⚪ 소요 미상'; }
    else if(it.remMos < 3){ st='🔴 발주 필요'; cls='danger'; }
    else if(it.remMos < 12){ st='🟢 정상'; cls='ok'; }
    else if(it.remMos < 24){ st='🟡 여유'; cls='warn'; }
    else { st='🟣 과잉'; }
    return '<tr>'+
      '<td><b>'+esc(it.b.name)+'</b><div class="sub2">'+esc(it.b.owner)+
        (it.b.defect>0 ? ' · 불량 '+Math.round(it.b.defect*100)+'%' : '')+'</div></td>'+
      '<td class="num">'+n(it.stock)+'</td>'+
      '<td class="num">'+n(it.need)+'</td>'+
      '<td class="num '+cls+'">'+n(it.rem)+'</td>'+
      '<td class="ctr" style="font-size:12px">'+st+'</td></tr>';
  }).join('');

  const short = items.filter(function(it){ return it.order>0 || (it.rem!==null && it.rem<0); });
  let alert = '';
  if(short.length){
    alert = '<div class="box-danger"><b style="color:#C0392B">🔴 발주 검토 ('+short.length+'종)</b><br><br>'+
      short.map(function(it){
        const price = num(it.m.price);
        let line = '▸ <b>'+esc(it.b.name)+'</b><br>'+
          '생산 후 잔여 <b class="danger">'+n(it.rem)+'개</b>'+
          (it.remMos!==null ? ' (약 '+it.remMos+'개월치)' : '')+'<br>'+
          '권장 발주 <b>'+n(it.order)+'개</b> · MOQ '+n(it.m.moq)+
          (it.m.sup ? ' · '+esc(it.m.sup) : '')+'<br>';
        line += '<span class="sub2">' +
          (price ? '예상 '+n(it.order*price)+'원 · ' : '') +
          '리드타임 '+n(it.m.lead)+'일</span>';
        return line;
      }).join('<br><br>')+'</div>';
  } else {
    alert = '<div class="box-ok">🟢 생산 후에도 3개월치 이상 남습니다. 발주 불필요.</div>';
  }

  const un = items.filter(function(it){ return it.rem===null; });
  const unNote = un.length ? '<div class="box-note">⚪ '+
    un.map(function(it){ return esc(it.b.name); }).join(', ')+
    ' 는 재고 미확인이라 계산에서 빠졌습니다.</div>' : '';

  body.innerHTML =
    '<div class="tbl-wrap"><table><thead><tr>'+
    '<th style="text-align:left">부자재</th><th>현재고</th><th>필요</th><th>잔여</th><th>상태</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>' + alert + unNote +
    '<div class="sub2" style="line-height:1.7">· 필요 수량은 BOM 실소요량(불량률 포함) × 생산 수량입니다.<br>'+
    '· 발주 권장은 생산 후 잔여가 3개월치에 못 미칠 때만 계산됩니다.</div>';
}

/* ── 입출고 등록 ──────────────────────── */
async function submitLog(){
  const p = {
    action:'log',
    code:   document.getElementById('fCode').value,
    kind:   document.getElementById('fKind').value,
    reason: document.getElementById('fReason').value,
    qty:    document.getElementById('fQty').value,
    ref:    document.getElementById('fRef').value,
    memo:   document.getElementById('fMemo').value
  };
  if(!p.code || !p.kind || !p.reason || !p.qty){
    lm('부자재·구분·사유·수량을 모두 입력하세요.', true); return;
  }
  lm('등록 중...', false);
  try{
    const r = await api(p);
    if(!r.ok){ lm(r.msg || '등록에 실패했습니다.', true); return; }
    D = r; lm('등록했습니다.', false);
    document.getElementById('logMsg').className = 'msg good';
    ['fQty','fRef','fMemo'].forEach(function(id){ document.getElementById(id).value=''; });
    renderStock();
    accessLoaded = false;   // 방금 남긴 기록이 반영되도록
    document.getElementById('updated').textContent = '갱신 ' + r.updated;
    setTimeout(function(){ tab('p1'); lm('',false); }, 900);
  }catch(e){ lm('오류: '+e.message, true); }
}

function lm(t, err){
  const el = document.getElementById('logMsg');
  el.textContent = t; el.className = 'msg' + (err ? ' err' : '');
}

/* ── 접근로그 (관리자) ────────────────── */
async function loadAccess(){
  const body = document.getElementById('accessBody');
  body.innerHTML = '<div class="box-note">불러오는 중...</div>';
  try{
    const r = await api({ action:'access' });
    if(!r.ok){
      body.innerHTML = '<div class="box-note">'+esc(r.msg || '불러오지 못했습니다.')+'</div>';
      return;
    }
    accessLoaded = true;
    if(!r.logs.length){
      body.innerHTML = '<div class="box-note">기록이 없습니다.</div>'; return;
    }
    const rows = r.logs.map(function(l){
      let cls = '';
      if(l.result==='실패' || l.result==='입력거부' || l.result==='열람거부') cls='danger';
      else if(l.result==='입력') cls='ok';
      return '<tr>'+
        '<td class="sub2" style="white-space:nowrap">'+esc(l.t)+'</td>'+
        '<td class="ctr '+cls+'" style="font-size:12px;white-space:nowrap">'+esc(l.result)+'</td>'+
        '<td style="font-size:12px;white-space:nowrap">'+esc(l.user||'—')+'</td>'+
        '<td style="font-size:12px">'+esc(l.memo)+'</td></tr>';
    }).join('');
    body.innerHTML =
      '<div class="tbl-wrap"><table><thead><tr>'+
      '<th>시각</th><th>결과</th><th>사용자</th><th style="text-align:left">상세</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="sub2">최근 '+r.logs.length+'건 · 시트에는 500건까지 보관됩니다.</div>';
  }catch(e){
    body.innerHTML = '<div class="box-note">연결 실패: '+esc(e.message)+'</div>';
  }
}

/* ── 새로고침 ─────────────────────────── */
async function reload(){
  try{
    const r = await api();
    if(!r.ok){ logout(); gm('다시 로그인해 주세요.'); return; }
    if(r.role !== ROLE){ start(r); return; }   // 권한이 바뀌었으면 화면을 다시 짠다
    D = r; renderProducts(); renderStock();
    document.getElementById('updated').textContent = '갱신 ' + r.updated;
  }catch(e){}
}

/* ── 세션 감시 ────────────────────────
   ① 다른 창·다른 버전 페이지에서 로그아웃하면 이쪽도 따라 나간다
   ② 앱으로 되돌아올 때 서버에 다시 물어본다 (비번이 바뀌었으면 튕겨냄)   */
window.addEventListener('storage', function(e){
  if(e.key === PW_STORE && !e.newValue && PW) logout();
});

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible' || !PW) return;
  let saved = null;
  try{ saved = localStorage.getItem(PW_STORE); }catch(e){}
  if(saved !== PW){ logout(); return; }   // 저장값이 사라졌거나 달라짐
  reload();                               // 서버 재확인 겸 재고 갱신
});

/* ── 자동 로그인 ──────────────────────── */
(async function(){
  let savedPw = null, savedNm = null;
  try{
    savedPw = localStorage.getItem(PW_STORE);
    savedNm = localStorage.getItem(NM_STORE);
    localStorage.removeItem('bujae_pw');   // 구 버전 잔재 정리
  }catch(e){}
  if(savedNm) document.getElementById('nm').value = savedNm;
  if(!savedPw || !savedNm) return;
  PW = savedPw; USER = savedNm; gm('확인 중...');
  try{
    const r = await api();
    if(r.ok){ start(r); }
    else {
      PW=''; USER='';
      try{ localStorage.removeItem(PW_STORE); }catch(e){}
      gm('비밀번호가 변경되었습니다. 다시 입력해 주세요.');
    }
  }catch(e){ PW=''; USER=''; gm(''); }
})();
