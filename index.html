<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부자재 AI 계산기</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;background:#F5F6FA;height:100vh;display:flex;flex-direction:column;}
#header{background:#1A1A2E;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#header .icon{width:38px;height:38px;border-radius:50%;background:#3F51B5;display:flex;align-items:center;justify-content:center;font-size:18px;}
#header .title{font-weight:700;font-size:15px;}
#header .sub{font-size:11px;opacity:.6;margin-top:2px;}
#quickbar{padding:10px 16px 8px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;background:#fff;border-bottom:1px solid #EEE;}
#quickbar button{white-space:nowrap;padding:5px 13px;border-radius:20px;border:1px solid #E0E0E0;background:#F8F8F8;font-size:12px;color:#333;cursor:pointer;font-family:inherit;flex-shrink:0;}
#quickbar button:hover{background:#E8EAF6;border-color:#9FA8DA;}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg-user{display:flex;justify-content:flex-end;}
.msg-user .bubble{background:#1A1A2E;color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:75%;font-size:14px;line-height:1.6;}
.msg-bot{display:flex;justify-content:flex-start;}
.msg-bot .bubble{background:#fff;border:1px solid #E8E8E8;border-radius:4px 18px 18px 18px;padding:12px 16px;max-width:92%;font-size:14px;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.06);}
#inputbar{padding:12px 16px;background:#fff;border-top:1px solid #EEE;display:flex;gap:10px;flex-shrink:0;}
#inputbar input{flex:1;padding:10px 16px;border-radius:24px;border:1px solid #E0E0E0;font-size:14px;outline:none;background:#F8F8F8;font-family:inherit;}
#inputbar input:focus{border-color:#9FA8DA;background:#fff;}
#inputbar button{padding:10px 20px;border-radius:24px;background:#1A1A2E;color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
#inputbar button:disabled{background:#E0E0E0;cursor:default;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:7px 10px;text-align:center;font-weight:600;border-bottom:2px solid #E0E0E0;color:#333;white-space:nowrap;background:#F5F5F5;}
td{padding:6px 10px;border-bottom:1px solid #F0F0F0;}
.cat-prod{color:#1A237E;font-weight:700;font-size:12px;}
.cat-out{color:#1B5E20;font-weight:700;font-size:12px;}
.status-ok{color:#1B5E20;font-weight:600;}
.status-warn{color:#7D5A00;font-weight:600;}
.status-danger{color:#C0392B;font-weight:600;}
.order-box{background:#FDECEA;border:1px solid #FFCDD2;border-radius:10px;padding:12px 16px;margin-top:12px;}
.order-title{font-weight:700;color:#C0392B;margin-bottom:8px;font-size:14px;}
.order-item{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #FFCDD2;font-size:13px;color:#555;line-height:1.9;}
.order-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.order-item b{color:#1A1A2E;}
.ok-box{background:#E8F5E9;border:1px solid #A5D6A7;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px;color:#1B5E20;}
.warn-box{background:#FFFDE7;border:1px solid #FFE082;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px;color:#7D5A00;}
.result-header{background:#1A1A2E;color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.result-header .date{font-size:12px;opacity:.6;margin-bottom:2px;}
.result-header .main{font-size:15px;font-weight:600;}
.result-header .qty{color:#90CAF9;}
.tbl-wrap{overflow-x:auto;margin-bottom:4px;}
.section-label{font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;margin:10px 0 6px;}
.section-prod{background:#E8EAF6;color:#1A237E;}
.section-out{background:#E8F5E9;color:#1B5E20;}
.typing{display:flex;align-items:center;gap:6px;color:#888;font-size:14px;padding:4px 0;}
.dot{width:7px;height:7px;border-radius:50%;background:#BBB;animation:bounce .8s infinite;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
</style>
</head>
<body>
<div id="header">
  <div class="icon">📦</div>
  <div>
    <div class="title">부자재 AI 계산기</div>
    <div class="sub">생산 부자재 · 출고 부자재 분리 관리</div>
  </div>
</div>
<div id="quickbar">
  <button onclick="send('Notte Duffle Bag 300개 생산할 때 생산 부자재 확인해줘')">🔵 생산 300개</button>
  <button onclick="send('Aube Soft Shopper Bag 500개 생산 부자재 알려줘')">🔵 생산 500개</button>
  <button onclick="send('출고 부자재 재고 현황 보여줘')">🟢 출고 재고현황</button>
  <button onclick="send('생산 부자재 재고 현황 보여줘')">🔵 생산 재고현황</button>
  <button onclick="send('전체 재고 현황 보여줘')">📊 전체 현황</button>
  <button onclick="send('거래처 정보 알려줘')">📋 거래처</button>
</div>
<div id="messages"></div>
<div id="inputbar">
  <input id="txt" placeholder="예: 300개 생산할 때 생산 부자재 알려줘" onkeydown="if(event.key==='Enter')send()"/>
  <button id="sendbtn" onclick="send()">전송</button>
</div>
<script>
const TODAY = new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});

const PROD_MATERIALS = [
  {id:1,cat:"생산",name:"로고라벨",  stock:500,safe:200,per:1,lead:"3일", sup:"하나라벨",   contact:"안경석 / 02-2272-7247",                           moq:1000,price:140, note:""},
  {id:2,cat:"생산",name:"케어라벨",  stock:500,safe:200,per:1,lead:"7일", sup:"XBS",        contact:"이돈창 / 010-6385-6994",                           moq:1000,price:50,  note:""},
  {id:3,cat:"생산",name:"로고 행택", stock:500,safe:200,per:1,lead:"7일", sup:"비즈하우스", contact:"https://www.bizhows.com",                           moq:1000,price:59,  note:"반누보 209g"},
  {id:4,cat:"생산",name:"무지 행택", stock:500,safe:200,per:1,lead:"7일", sup:"비즈하우스", contact:"https://www.bizhows.com",                           moq:1000,price:59,  note:"반누보 209g"},
  {id:5,cat:"생산",name:"행택 끈",   stock:500,safe:300,per:1,lead:"3일", sup:"드림팩토리", contact:"https://www.coupang.com/vp/products/8613696153",   moq:1000,price:8,   note:"원터치 사각 택끈 블랙"},
];
const OUT_MATERIALS = [
  {id:6,cat:"출고",name:"출고용 택배 박스",stock:32, safe:10, per:1,lead:"4일", sup:"박스포유", contact:"https://www.box4u.co.kr",        moq:32,  price:778, note:"450×320×200"},
  {id:7,cat:"출고",name:"입고용 카톤 박스",stock:110,safe:30, per:0,lead:"-",   sup:"XBS",      contact:"이돈창 / 010-6385-6994",         moq:200, price:1550,note:"500×400×560"},
  {id:8,cat:"출고",name:"더스트백",        stock:700,safe:50, per:1,lead:"21일",sup:"가온포장", contact:"김현기 / 010-4509-8714",         moq:1000,price:620, note:"70g WH 복주머니"},
];
const ALL_MATERIALS = [...PROD_MATERIALS, ...OUT_MATERIALS];
const PRODUCTS = ["Notte Duffle Bag","Aube Suede Shopper Bag","Aube Soft Shopper Bag","Mardi Laptop Bag"];

function n(v){return v==null?"-":Number(v).toLocaleString("ko-KR");}
function parseQty(t){const m=t.match(/([0-9,]+)\s*개/);return m?parseInt(m[1].replace(/,/g,"")):null;}
function parseProd(t){return PRODUCTS.find(p=>t.toLowerCase().includes(p.toLowerCase()))||null;}

function calcItems(materials, qty){
  return materials.map(m=>{
    const needed=m.per>0?qty*m.per:null;
    const rem=needed!==null?m.stock-needed:null;
    const short=rem!==null&&rem<m.safe;
    const orderQ=short?Math.ceil((m.safe-rem)/m.moq)*m.moq:0;
    return{...m,needed,rem,short,orderQ};
  });
}

function statusHTML(m){
  if(m.needed===null) return '<span style="color:#888">➖ 해당없음</span>';
  if(m.short)         return '<span class="status-danger">🔴 발주 필요</span>';
  if(m.rem<m.safe*1.5)return '<span class="status-warn">🟡 주의</span>';
  return '<span class="status-ok">🟢 충분</span>';
}

function buildTable(items){
  const rows=items.map(m=>{
    const bg=m.short?"#FDECEA":m.rem!==null&&m.rem<m.safe*1.5?"#FFFDE7":"";
    const bgStyle=bg?`style="background:${bg}"`:"";
    const remVal=m.rem!==null?(m.short?`<b style="color:#C0392B">${n(m.rem)}</b>`:n(m.rem)):"-";
    const catClass=m.cat==="생산"?"cat-prod":"cat-out";
    return `<tr ${bgStyle}>
      <td class="${catClass}" style="text-align:center">${m.cat}</td>
      <td style="font-weight:600;color:#1A1A2E">${m.name}</td>
      <td style="text-align:center;font-weight:700">${n(m.stock)}</td>
      <td style="text-align:center">${m.needed!==null?n(m.needed):"-"}</td>
      <td style="text-align:center">${remVal}</td>
      <td style="text-align:center;color:#888">${n(m.safe)}</td>
      <td style="text-align:center">${statusHTML(m)}</td>
    </tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>분류</th><th>부자재명</th><th>현재 재고</th><th>필요 수량</th><th>생산 후 잔여</th><th>안전재고</th><th>상태</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function buildOrderHTML(items){
  const shortages=items.filter(i=>i.short);
  const warnings=items.filter(i=>!i.short&&i.rem!==null&&i.rem<i.safe*1.5);
  if(shortages.length>0){
    const rows=shortages.map(m=>`<div class="order-item">
      <b>▸ ${m.name}</b> (${m.cat})<br>
      현재 재고 <b>${n(m.stock)}개</b> → 생산 후 잔여 <b style="color:#C0392B">${n(m.rem)}개</b> (안전재고 ${n(m.safe)}개 미달)<br>
      추가 발주: <b style="color:#1A237E">${n(m.orderQ)}개</b> (MOQ ${n(m.moq)}개) | 거래처: <b>${m.sup}</b>${m.contact?" / "+m.contact:""}<br>
      <span style="color:#888">예상 발주금액: ${n(m.orderQ*m.price)}원 | 리드타임: ${m.lead}</span>
    </div>`).join("");
    return `<div class="order-box"><div class="order-title">🔴 발주 필요 (${shortages.length}종)</div>${rows}</div>`;
  }
  if(warnings.length>0){
    return `<div class="warn-box">🟡 <b>${warnings.map(w=>w.name).join(", ")}</b> 안전재고 1.5배 미만 — 곧 발주 준비하세요.</div>`;
  }
  return `<div class="ok-box">🟢 모든 부자재 충분합니다!</div>`;
}

function buildResultHTML(qty, product, prodItems, outItems, showProd, showOut){
  const header=`<div class="result-header">
    <div class="date">${TODAY} 기준</div>
    <div class="main">${product?product+" ":""}<span class="qty">${n(qty)}개</span> 생산 분석 결과</div>
  </div>`;
  let body="";
  if(showProd){
    body+=`<div class="section-label section-prod">🔵 생산 부자재 (제품 봉제/제작 시 사용)</div>`;
    body+=buildTable(prodItems);
    body+=buildOrderHTML(prodItems);
  }
  if(showOut){
    body+=`<div class="section-label section-out" style="margin-top:14px">🟢 출고 부자재 (포장/배송 시 사용)</div>`;
    body+=buildTable(outItems);
    body+=buildOrderHTML(outItems);
  }
  return header+body;
}

function buildStockHTML(materials, title, labelClass){
  const rows=materials.map((m,i)=>{
    const status=m.stock<m.safe?"🔴 발주 필요":m.stock<m.safe*1.5?"🟡 주의":"🟢 정상";
    const bg=m.stock<m.safe?"#FDECEA":m.stock<m.safe*1.5?"#FFFDE7":i%2===0?"#fff":"#FAFAFA";
    const sc=m.stock<m.safe?"status-danger":m.stock<m.safe*1.5?"status-warn":"status-ok";
    return `<tr style="background:${bg}">
      <td style="font-weight:600">${m.name}</td>
      <td style="text-align:center;font-weight:700">${n(m.stock)}</td>
      <td style="text-align:center;color:#888">${n(m.safe)}</td>
      <td style="text-align:center"><span class="${sc}">${status}</span></td>
      <td style="color:#555">${m.sup}</td>
      <td style="color:#555;font-size:12px">${m.lead}</td>
    </tr>`;
  }).join("");
  return `<div class="section-label ${labelClass}">${title} (${TODAY} 기준)</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>부자재명</th><th>현재 재고</th><th>안전재고</th><th>상태</th><th>거래처</th><th>리드타임</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function buildSupplierHTML(materials, title, labelClass){
  const rows=materials.map((m,i)=>`<tr style="background:${i%2===0?"#fff":"#FAFAFA"}">
    <td style="font-weight:700">${m.sup}</td>
    <td>${m.name}</td>
    <td style="font-size:12px;color:#1976D2;word-break:break-all">${m.contact||"-"}</td>
    <td style="text-align:center">${n(m.moq)}</td>
    <td style="text-align:center;font-weight:600;color:#1A237E">${n(m.price)}원</td>
    <td style="text-align:center">${m.lead}</td>
  </tr>`).join("");
  return `<div class="section-label ${labelClass}">${title}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>거래처</th><th>부자재명</th><th>연락처/URL</th><th>MOQ</th><th>단가</th><th>리드타임</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function addMsg(role,html){
  const wrap=document.createElement("div"); wrap.className=role==="user"?"msg-user":"msg-bot";
  const bubble=document.createElement("div"); bubble.className="bubble"; bubble.innerHTML=html;
  wrap.appendChild(bubble);
  document.getElementById("messages").appendChild(wrap);
  wrap.scrollIntoView({behavior:"smooth",block:"end"});
  return bubble;
}
function showTyping(){return addMsg("bot",'<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:2px">계산 중…</span></div>');}

async function send(preset){
  const txt=document.getElementById("txt");
  const msg=(preset||txt.value).trim(); if(!msg)return;
  txt.value=""; document.getElementById("sendbtn").disabled=true;
  addMsg("user",msg);
  const tb=showTyping();
  await new Promise(r=>setTimeout(r,500));
  tb.parentElement.remove();

  const lower=msg.toLowerCase();
  const qty=parseQty(msg);
  const product=parseProd(msg);
  const isProd=lower.includes("생산")&&!lower.includes("출고");
  const isOut=lower.includes("출고")&&!lower.includes("생산");
  const isStockQ=lower.includes("재고")&&(lower.includes("현황")||lower.includes("보여")||lower.includes("알려"))&&!qty;
  const isSupQ=(lower.includes("거래처")||lower.includes("업체")||lower.includes("연락처"))&&!qty;

  if(isStockQ){
    let html="";
    if(isProd||(!isProd&&!isOut)){
      html+=buildStockHTML(PROD_MATERIALS,"🔵 생산 부자재 재고 현황","section-prod");
    }
    if(isOut||(!isProd&&!isOut)){
      html+=buildStockHTML(OUT_MATERIALS,"🟢 출고 부자재 재고 현황","section-out");
    }
    addMsg("bot",html);
  } else if(isSupQ){
    let html="";
    if(isProd||(!isProd&&!isOut)){
      html+=buildSupplierHTML(PROD_MATERIALS,"🔵 생산 부자재 거래처","section-prod");
    }
    if(isOut||(!isProd&&!isOut)){
      html+=buildSupplierHTML(OUT_MATERIALS,"🟢 출고 부자재 거래처","section-out");
    }
    addMsg("bot",html);
  } else if(qty){
    const showProd = !isOut;
    const showOut  = isOut || (!isProd && !isOut);
    const prodItems = showProd ? calcItems(PROD_MATERIALS, qty) : [];
    const outItems  = showOut  ? calcItems(OUT_MATERIALS,  qty) : [];
    addMsg("bot", buildResultHTML(qty, product, prodItems, outItems, showProd, showOut));
  } else {
    const system=`당신은 패션 브랜드 부자재 재고 관리 전문 어시스턴트입니다.
부자재는 두 가지로 분류됩니다:
[생산 부자재] 로고라벨(재고500), 케어라벨(재고500), 로고 행택(재고500), 무지 행택(재고500), 행택 끈(재고500)
[출고 부자재] 출고용 택배 박스(재고32), 입고용 카톤 박스(재고110), 더스트백(재고700)
생산 관련 질문 → 생산 부자재만, 출고/포장 관련 질문 → 출고 부자재만 답변하세요.
짧고 명확하게 한국어로 답변하세요.`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system,messages:[{role:"user",content:msg}]})
      });
      const data=await res.json();
      const text=(data.content||[]).map(c=>c.text||"").join("")||"죄송해요, 다시 질문해주세요.";
      addMsg("bot",text.replace(/\n/g,"<br>"));
    }catch(e){addMsg("bot","⚠️ 오류가 발생했어요. 잠시 후 다시 시도해주세요.");}
  }
  document.getElementById("sendbtn").disabled=false;
}

addMsg("bot",`<div>
  <div style="font-size:28px;margin-bottom:8px">📦</div>
  <div style="font-weight:700;font-size:15px;margin-bottom:6px">부자재 AI 계산기예요!</div>
  <div style="color:#555;margin-bottom:12px;font-size:14px">생산/출고 부자재를 분리해서 관리해요.</div>
  <div style="font-size:12px;color:#888;background:#F8F8F8;border-radius:8px;padding:10px 14px;line-height:1.9">
    🔵 <b>생산 부자재</b>: 로고라벨, 케어라벨, 행택, 행택 끈<br>
    🟢 <b>출고 부자재</b>: 택배 박스, 카톤 박스, 더스트백<br><br>
    💡 "300개 생산할 때 생산 부자재 알려줘"<br>
    💡 "출고 부자재 재고 현황 보여줘"
  </div>
</div>`);
</script>
</body>
</html>
