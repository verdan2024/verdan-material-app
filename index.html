<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- maximum-scale 은 넣지 않는다. 독립 앱 모드에서 입력 칸 포커스를 막는다.
     입력 칸 글자가 16px 이라 이것 없이도 화면이 멋대로 확대되지 않는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>버던_재고</title>

<!-- 홈화면 아이콘 · 공통 코어 저장소에서 가져온다. 아이콘을 바꾸려면 그쪽 파일만 교체하면 된다. -->
<link rel="apple-touch-icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<link rel="icon" href="https://verdan2024.github.io/verdan-core/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="버던재고">
<meta name="theme-color" content="#30382A">

<!-- ── 공통 코어 ───────────────────────────────────────
     ?v= 숫자만 올리면 캐시가 갈리고 새 코어가 적용된다.
     문제가 생기면 이 숫자를 되돌리는 것만으로 즉시 롤백된다. -->
<link rel="stylesheet" href="https://verdan2024.github.io/verdan-core/verdan-core.css?v=1.1.6">
<script src="https://verdan2024.github.io/verdan-core/verdan-core.js?v=1.1.6"></script>

<style>
/* ── 이 앱에만 있는 것 ──────────────────────────────── */
/* 거래처 상세 — 색은 verdan-core 팔레트 안에서만 고른다 */
.vd{background:#FAFAF7;font-size:12px;line-height:2.0;}
.vd b{display:inline-block;min-width:96px;color:var(--v-mute);font-weight:600;}
.vd a{color:var(--v-link);}
.seg{margin-bottom:14px;}
</style>
</head>
<body>

<div id="app">
  <div id="header"></div>

  <div id="tabs">
    <button data-page="p1" class="on">재고</button>
    <button data-page="p2">생산 계산</button>
    <button data-page="p3" data-perm="log">입출고</button>
    <button data-page="p4" data-perm="access">접근로그</button>
  </div>

  <!-- 재고 -->
  <div id="p1" class="page on">
    <div class="seg">
      <button id="sgP" class="on" onclick="stockView('prod')">제품</button>
      <button id="sgM" onclick="stockView('mat')">부자재</button>
    </div>
    <div id="prodBody" data-clear></div>
    <div id="stockBody" data-clear style="display:none"></div>
    <button class="f ghost" id="reloadBtn" onclick="VERDAN.reload(true)">새로고침</button>
  </div>

  <!-- 생산 계산 -->
  <div id="p2" class="page">
    <div class="card">
      <h3>생산 계획</h3>
      <select id="cDesign" data-clear></select>
      <input class="f" type="number" id="cQty" data-reset placeholder="생산 수량" inputmode="numeric">
      <button class="f" onclick="calc()">계산</button>
    </div>
    <div id="calcBody" data-clear></div>
  </div>

  <!-- 입출고 -->
  <div id="p3" class="page">
    <div class="card">
      <h3>입출고 등록</h3>
      <select id="fCode" data-clear></select>
      <select id="fKind" data-clear></select>
      <select id="fReason" data-clear></select>
      <input class="f" type="number" id="fQty" data-reset placeholder="수량" inputmode="numeric">
      <div class="sub2" style="margin:-4px 0 10px">입고·출고는 양수만. 음수는 [조정]에서만.</div>
      <input class="f" type="text" id="fRef" data-reset placeholder="관련번호 (발주번호 · 로트 · 해당 월)">
      <input class="f" type="text" id="fMemo" data-reset placeholder="메모 (선택)">
      <button class="f" id="logBtn" onclick="submitLog()">등록</button>
      <div class="msg" id="logMsg"></div>
    </div>
  </div>

  <!-- 접근로그
       접속 / 기록 두 탭과 표는 코어가 그립니다.
       이 앱에는 채팅이 없으므로 채팅 탭을 만들지 않습니다(logKinds). -->
  <div id="p4" class="page">
    <div class="seg" id="segLog"></div>
    <div id="accessBody" data-clear></div>
    <button class="f ghost" onclick="VERDAN.loadLogs(true)">새로고침</button>
  </div>

  <div class="foot">버던_재고 · v5.1 · core <span id="coreVer"></span></div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   버던_재고 v5.1   (verdan-core 1.1.0 / 버던_재고 API v3.6)
   공통 부분(로그인·통신·워터마크·세션·권한)은 verdan-core.js 가 처리한다.
   이 파일에는 재고 · BOM · 발주 계산 로직만 둔다.

   v5.0 → v5.1
   ① 접근로그를 코어가 그린다 (V.loadLogs).
      탭이 접속 / 기록 둘로 나뉜다.
        접속 = 로그인 성공·실패
        기록 = 입출고 등록 · 중복 확인 · 권한거부
      서버가 각 줄에 kind 를 붙여 보내고, 자동 처리분은 코어가 걸러낸다.
   ② 채팅 탭은 만들지 않는다. 이 앱에는 채팅 기능이 없다.
      서버도 features.chat=false 로 알려 온다.
   ③ 로그인 안내 문구(hint) → 코어 고정. 앱에서 넘기지 않는다.
      예전에는 "입출고 기록에 함께 남습니다" 로 혼자 달랐다.
   ══════════════════════════════════════════════════════ */

/* Apps Script 웹앱 URL. 재배포해서 URL 이 바뀌면 이 줄만 고치면 된다. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSpg7_qMtWB-5TRqETUGHmic_be-bf-sUesKwekm0G8Lg6Q7uzyNmgcb8OW9JU8Zv-/exec";

/* 코어 도구를 짧은 이름으로 당겨 쓴다 */
const V = VERDAN;
const esc = V.esc, jsq = V.js, n = V.n, num = V.num;

/* 접근로그 상태(목록 · 보고 있는 탭 · 불러왔는지)는 코어가 들고 있다 */

VERDAN.init({
  scriptUrl : SCRIPT_URL,
  appId     : 'stock',
  title     : '버던_재고',
  icon      : '📦',
  iconUrl   : 'https://verdan2024.github.io/verdan-core/apple-touch-icon.png',
  appVersion: 'v5.1',

  /* 기존 사용자가 다시 로그인하지 않도록 예전 저장 키를 그대로 쓴다 */
  store     : { pw:'verdan_pw', user:'verdan_user' },
  legacyKeys: ['bujae_pw'],

  /* 읽기는 빨리 포기하고, 쓰기는 끝까지 기다린다.
     실패 대가가 다르기 때문이다 — 읽기는 다시 부르면 되지만 쓰기는 중복 위험이 있다. */
  timeout   : { read:12000, write:30000 },
  recheckMs : 30000,
  wmOpacity : 0.05,

  /* 권한표 — 서버의 ROLES 와 짝을 맞춘다 */
  perm: {
    admin : { label:'관리자', log:true,  vendor:true,  access:true  },
    staff : { label:'담당자', log:true,  vendor:true,  access:false },
    guest : { label:'게스트', log:false, vendor:false, access:false }
  },
  noperm: { label:'—', log:false, vendor:false, access:false },

  onStart : boot,
  onData  : redraw,
  /* 이 앱에는 채팅이 없다. 접근로그 탭을 두 개만 만든다. */
  logKinds: ['access','work'],

  onTab   : function(p){ if(p==='p4') V.loadLogs(false); },
  onLogout: function(){ stockView('prod'); lm('',false); }
});

document.getElementById('coreVer').textContent = VERDAN.version;

/* ── 로그인 직후 1회 ───────────────────── */
function boot(D){
  /* 생산 계산 — 제품 목록 */
  const designs = [];
  D.bom.forEach(function(b){
    if(!designs.some(function(d){ return d.code===b.dcode; }))
      designs.push({ code:b.dcode, name:b.dname });
  });
  fill('cDesign', designs.map(function(d){ return {v:d.code, t:d.name}; }), '제품 선택');

  /* 입출고 — 권한이 있을 때만 채운다 */
  if(V.can('log')){
    fill('fCode', D.materials.map(function(m){ return {v:m.code, t:m.code+' · '+m.name}; }), '부자재 선택');
    fill('fKind',   D.kinds.map(function(k){ return {v:k,t:k}; }),   '구분 선택');
    fill('fReason', D.reasons.map(function(k){ return {v:k,t:k}; }), '사유 선택');
  }else{
    ['fCode','fKind','fReason'].forEach(function(id){ V.setHTML(id,''); });
    lm('', false);
  }

  redraw(D);
  stockView('prod');
}

/* ── 데이터가 새로 들어올 때마다 ───────── */
function redraw(D){
  renderProducts(D);
  renderStock(D);
}

function fill(id, items, ph){
  V.setHTML(id, '<option value="">'+ph+'</option>' +
    items.map(function(i){ return '<option value="'+esc(i.v)+'">'+esc(i.t)+'</option>'; }).join(''));
}

/* ── 재고: 제품 | 부자재 전환 ─────────── */
function stockView(v){
  const isProd = (v === 'prod');
  V.setDisp('prodBody',  isProd ? 'block' : 'none');
  V.setDisp('stockBody', isProd ? 'none'  : 'block');
  const p=document.getElementById('sgP'), m=document.getElementById('sgM');
  if(p) p.className = isProd ? 'on' : '';
  if(m) m.className = isProd ? ''   : 'on';
}

/* ── 제품 재고 (조회 전용) ────────────── */
function 디자인명(name){
  const s = String(name).replace(/^\[[^\]]*\]\s*/, '');   // [REFURB] · [협찬] 제거
  const i = s.indexOf('_');
  return i > 0 ? s.substring(0, i) : s;
}

function 제품표(rows, 상품명표시){
  const body = rows.map(function(x){
    const zero = x.tot <= 0;
    const sub = 상품명표시 ? esc(x.name) : esc(x.code);
    return '<tr>'+
      '<td><b>'+esc(x.opt || 디자인명(x.name))+'</b>'+
        '<div class="sub2">'+sub+'</div></td>'+
      '<td class="num">'+n(x.wh)+'</td>'+
      '<td class="num">'+n(x.ff)+'</td>'+
      '<td class="num '+(zero?'danger':'')+'">'+(zero ? '품절' : n(x.tot))+'</td></tr>';
  }).join('');
  return '<div class="tbl-wrap"><table><thead><tr>'+
    '<th style="text-align:left">옵션</th><th>창고</th><th>풀필</th><th>총</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}

function renderProducts(D){
  const P = (D && D.products) ? D.products : null;

  if(!P || !P.ok){
    V.setHTML('prodBody', '<div class="box-note">제품 재고를 불러오지 못했습니다.'+
      ((P && P.msg) ? '<br>'+esc(P.msg) : '')+
      '<br>재고관리_메인 파일의 접근 권한을 확인하세요.</div>');
    return;
  }

  const items = P.items || [];
  const 정상 = items.filter(function(x){ return x.kind === '정상품'; });
  /* 리퍼브·협찬은 재고가 있는 것만 — 0은 볼 이유가 없다 */
  const 리퍼브 = items.filter(function(x){ return x.kind.indexOf('리퍼브') >= 0 && x.tot > 0; });
  const 협찬  = items.filter(function(x){ return x.kind.indexOf('협찬')  >= 0 && x.tot > 0; });
  const 합 = function(a){ return a.reduce(function(s,x){ return s + x.tot; }, 0); };

  if(!정상.length){
    V.setHTML('prodBody', '<div class="box-note">제품 데이터가 없습니다.</div>');
    return;
  }

  let h = '<div class="box-ok">정상품 '+정상.length+'종 · 총 <b>'+n(합(정상))+'개</b></div>';

  /* 디자인별 묶음 — 원본 순서를 따른다 */
  const groups = [];
  정상.forEach(function(x){
    const d = 디자인명(x.name);
    let g = null;
    for(let i=0;i<groups.length;i++){ if(groups[i].name===d){ g=groups[i]; break; } }
    if(!g){ g = { name:d, rows:[] }; groups.push(g); }
    g.rows.push(x);
  });
  groups.forEach(function(g){
    h += '<div class="sec s-blu">'+esc(g.name)+' · '+n(합(g.rows))+'개</div>' + 제품표(g.rows, false);
  });

  /* 품절 알림 — 정상품 아래, 리퍼브 위 */
  const 품절 = 정상.filter(function(x){ return x.tot <= 0; });
  if(품절.length){
    h += '<div class="box-note">🔴 <b>품절 '+품절.length+'종</b><br>'+
      품절.map(function(x){ return esc(디자인명(x.name)+' · '+(x.opt||'')); }).join('<br>')+
      '</div>';
  }

  if(리퍼브.length) h += '<details><summary>리퍼브 제품 · '+n(합(리퍼브))+'개</summary>'+제품표(리퍼브, true)+'</details>';
  if(협찬.length)   h += '<details><summary>협찬 제품 · '+n(합(협찬))+'개</summary>'+제품표(협찬, true)+'</details>';

  h += '<div class="sub2" style="line-height:1.7">· 재고관리_메인 시트를 그대로 읽습니다. 앱에서는 수정할 수 없습니다.<br>'+
       '· 창고는 자사 보관, 풀필은 위탁 보관 수량입니다.<br>'+
       '· 리퍼브·협찬은 재고가 있는 것만 표시합니다.</div>';
  V.setHTML('prodBody', h);
}

/* ── 부자재 재고 ──────────────────────── */
/* 발주 알림을 띄우지 않는 분류.
   원단은 생산할 때마다 발주하는 물건이라 재고 0이 정상 상태다.
   신호등을 그대로 두면 매번 🔴 이 떠서 정작 봐야 할 품목이 묻힌다. */
const NO_ALERT = ['원단'];

/* 분류 구획. 새 분류가 생겨도 아래 CATS 에 한 줄 더하면 된다. */
const CATS = [
  { k:'생산', t:'🔵 생산 부자재', c:'s-blu' },
  { k:'출고', t:'🟢 출고 부자재', c:'s-grn' },
  { k:'원단', t:'🟤 원단',        c:'s-brn' }
];

function renderStock(D){
  let h = '';
  CATS.forEach(function(o){
    h += section(D, o.t, o.c, D.materials.filter(function(m){ return m.cat === o.k; }));
  });
  /* 분류가 비었거나 목록에 없는 값이면 조용히 사라지지 않도록 따로 모은다 */
  const rest = D.materials.filter(function(m){
    return !CATS.some(function(o){ return o.k === m.cat; });
  });
  if(rest.length) h += section(D, '⚪ 분류 미지정','s-gry',rest);

  V.setHTML('stockBody', h + 발주알림(D) + note(D));
}

function section(D, title, cls, list){
  if(!list.length) return '';
  const rows = list.map(function(m){
    const id = 'ven_' + String(m.code).replace(/[^A-Za-z0-9가-힣_-]/g,'_');
    const cell = m.sup
      ? '<span class="lnk" onclick="VERDAN.toggleBox(\''+jsq(id)+'\')">'+esc(m.sup)+'</span>'
      : '<span class="sub2">—</span>';
    return '<tr>'+
      '<td><b>'+esc(m.name)+'</b><div class="sub2">'+esc(m.code)+'</div></td>'+
      '<td class="num">'+n(m.stock)+'</td>'+
      '<td class="ctr" style="font-size:12px">'+cell+'</td></tr>'+
      '<tr id="'+esc(id)+'" style="display:none"><td colspan="3" class="vd">'+venCard(D,m)+'</td></tr>';
  }).join('');
  return '<div class="sec '+cls+'">'+title+'</div><div class="tbl-wrap"><table>'+
    '<thead><tr><th style="text-align:left">부자재</th><th>수량</th><th>거래처</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

function venCard(D, m){
  const v = (D.vendors || []).filter(function(x){ return x.vcode === m.vcode; })[0];
  if(!v) return '<span class="sub2">거래처마스터에 '+esc(m.vcode||'코드 없음')+' 정보가 없습니다.</span>';

  /* 담당자 · 연락처 → 홍길동 / 010-0000-0000 */
  const who = [];
  if(v.person) who.push(esc(v.person));
  if(v.tel) who.push('<a href="tel:'+esc(String(v.tel).replace(/[^0-9+]/g,''))+'">'+esc(v.tel)+'</a>');

  /* MOQ · 단가 → 1,000 / 8원 */
  const buy = [];
  if(num(m.moq))   buy.push(n(m.moq));
  if(num(m.price)) buy.push(n(m.price)+'원');

  return '<div><b>거래처코드</b> '+esc(v.vcode)+'</div>'+
    '<div><b>거래처명</b> '+esc(v.name)+'</div>'+
    '<div><b>상세스펙</b> '+(m.spec ? esc(m.spec)
      : '<span class="danger">미등록 — 공급품목 시트에 입력하세요</span>')+'</div>'+
    '<div><b>담당자 · 연락처</b> '+(who.length ? who.join(' / ') : '—')+'</div>'+
    '<div><b>URL</b> '+(v.url
      ? '<a href="'+esc(v.url)+'" target="_blank" rel="noopener">링크 열기</a>' : '—')+'</div>'+
    '<div><b>MOQ · 단가</b> '+(buy.length ? buy.join(' / ') : '—')+'</div>'+
    '<div><b>리드타임</b> '+(num(m.lead) ? n(m.lead)+'일' : '—')+'</div>'+
    '<div><b>발주 방법</b> '+(m.method ? esc(m.method) : '—')+'</div>';
}

/* 신호등 열을 뺐으므로, 발주가 필요한 것만 따로 알린다 */
function 발주알림(D){
  const need = D.materials.filter(function(m){
    if(NO_ALERT.indexOf(m.cat) >= 0) return false;
    return m.state && m.state.indexOf('🔴') >= 0;
  });
  if(!need.length) return '';
  return '<div class="box-danger"><b style="color:var(--v-danger)">🔴 발주 필요 '+need.length+'종</b><br>'+
    need.map(function(m){ return esc(m.name)+(m.sup ? ' · '+esc(m.sup) : ''); }).join('<br>')+
    '</div>';
}

function note(D){
  const un = D.materials.filter(function(m){ return m.fix==='미확인'; });
  const js = D.materials.filter(function(m){ return m.fix==='잠정'; });
  let h = '';
  if(un.length) h += '<div class="box-note">⚪ <b>수량 미확인</b> — '+
      un.map(function(m){ return esc(m.name); }).join(', ')+
      '<br>확인 후 시트의 기초재고·기준일·재고확정을 채우세요.</div>';
  if(js.length) h += '<div class="box-note">🟠 <b>잠정 수량</b> — '+
      js.map(function(m){ return esc(m.name); }).join(', ')+' · 실사 후 [확정]으로 변경하세요.</div>';
  return h;
}

/* ── 생산 계산 ────────────────────────── */
function calc(){
  const D = V.data();
  if(!D) return;
  const dcode = document.getElementById('cDesign').value;
  const qty   = parseInt(document.getElementById('cQty').value, 10);
  if(!dcode || !qty || qty<=0){
    V.setHTML('calcBody','<div class="box-note">제품과 생산 수량을 입력하세요.</div>'); return;
  }

  const lines = D.bom.filter(function(b){ return b.dcode===dcode; });
  if(!lines.length){ V.setHTML('calcBody','<div class="box-note">이 제품의 BOM이 없습니다.</div>'); return; }

  const items = lines.map(function(b){
    const m = D.materials.filter(function(x){ return x.code===b.code; })[0] || {};
    const need  = Math.ceil((b.real || b.qty) * qty);
    const stock = num(m.stock);
    const rem   = stock===null ? null : stock - need;
    const mon   = num(m.monthly) || 0;
    const moq   = num(m.moq) || 1;
    /* 잔여가 3개월치에 못 미치면 그 부족분만 MOQ 단위로 올림 (이중 가산 없음) */
    const target= mon * 3;
    const lack  = (rem===null) ? null : Math.max(0, target - rem);
    const order = (lack && lack>0) ? Math.ceil(lack/moq)*moq : 0;
    return { b:b, m:m, need:need, stock:stock, rem:rem, mon:mon, order:order,
             remMos: (rem===null||mon===0) ? null : Math.round(rem/mon*10)/10 };
  });

  const rows = items.map(function(it){
    let st, cls='';
    if(it.rem===null){ st='⚪ 미확인'; }
    else if(it.rem < 0){ st='🔴 부족'; cls='danger'; }
    else if(it.mon===0){ st='⚪ 소요 미상'; }
    else if(it.remMos < 3){ st='🔴 발주 필요'; cls='danger'; }
    else if(it.remMos < 12){ st='🟢 정상'; cls='ok'; }
    else if(it.remMos < 24){ st='🟡 여유'; cls='warn'; }
    else { st='🟣 과잉'; }
    return '<tr>'+
      '<td><b>'+esc(it.b.name)+'</b><div class="sub2">'+esc(it.b.owner)+
        (it.b.defect>0 ? ' · 불량 '+Math.round(it.b.defect*100)+'%' : '')+'</div></td>'+
      '<td class="num">'+n(it.stock)+'</td>'+
      '<td class="num">'+n(it.need)+'</td>'+
      '<td class="num '+cls+'">'+n(it.rem)+'</td>'+
      '<td class="ctr" style="font-size:12px">'+st+'</td></tr>';
  }).join('');

  const short = items.filter(function(it){ return it.order>0 || (it.rem!==null && it.rem<0); });
  let alertHtml = '';
  if(short.length){
    alertHtml = '<div class="box-danger"><b style="color:var(--v-danger)">🔴 발주 검토 ('+short.length+'종)</b><br><br>'+
      short.map(function(it){
        const price = num(it.m.price);
        let line = '▸ <b>'+esc(it.b.name)+'</b><br>'+
          '생산 후 잔여 <b class="danger">'+n(it.rem)+'개</b>'+
          (it.remMos!==null ? ' (약 '+it.remMos+'개월치)' : '')+'<br>'+
          '권장 발주 <b>'+n(it.order)+'개</b> · MOQ '+n(it.m.moq)+
          (it.m.sup ? ' · '+esc(it.m.sup) : '')+'<br>';
        line += '<span class="sub2">' +
          (price ? '예상 '+n(it.order*price)+'원 · ' : '') +
          '리드타임 '+n(it.m.lead)+'일</span>';
        return line;
      }).join('<br><br>')+'</div>';
  } else {
    alertHtml = '<div class="box-ok">🟢 생산 후에도 3개월치 이상 남습니다. 발주 불필요.</div>';
  }

  const un = items.filter(function(it){ return it.rem===null; });
  const unNote = un.length ? '<div class="box-note">⚪ '+
    un.map(function(it){ return esc(it.b.name); }).join(', ')+
    ' 는 재고 미확인이라 계산에서 빠졌습니다.</div>' : '';

  V.setHTML('calcBody',
    '<div class="tbl-wrap"><table><thead><tr>'+
    '<th style="text-align:left">부자재</th><th>현재고</th><th>필요</th><th>잔여</th><th>상태</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>' + alertHtml + unNote +
    '<div class="sub2" style="line-height:1.7">· 필요 수량은 BOM 실소요량(불량률 포함) × 생산 수량입니다.<br>'+
    '· 발주 권장은 생산 후 잔여가 3개월치에 못 미칠 때만 계산됩니다.</div>');
}

/* ── 입출고 등록 ──────────────────────── */
async function submitLog(){
  if(V.isBusy()) return;
  const p = {
    action:'log',
    code:   document.getElementById('fCode').value,
    kind:   document.getElementById('fKind').value,
    reason: document.getElementById('fReason').value,
    qty:    document.getElementById('fQty').value,
    ref:    document.getElementById('fRef').value,
    memo:   document.getElementById('fMemo').value
  };
  if(!p.code || !p.kind || !p.reason || !p.qty){
    lm('부자재·구분·사유·수량을 모두 입력하세요.', true); return;
  }
  const btn = document.getElementById('logBtn');
  V.busy(true); btn.disabled = true; btn.textContent = '등록 중...';
  lm('등록 중...', false);
  try{
    /* idem 을 주면 같은 내용으로 다시 눌러도 서버가 중복을 걸러낼 수 있다 */
    const r = await V.api(p, { mode:'write', idem:'log:'+p.code+':'+p.kind+':'+p.qty+':'+p.ref });
    if(!r.ok){ lm(r.msg || '등록에 실패했습니다.', true); return; }
    V.setData(r);
    lm('등록했습니다.', false);
    ['fQty','fRef','fMemo'].forEach(function(id){ V.setVal(id,''); });
    /* 방금 남긴 기록이 접근로그에 반영되도록 다시 불러온다.
       열람 권한이 없는 담당자는 부를 필요가 없다(서버가 거부한다). */
    if(V.can('access')) V.loadLogs(true).catch(function(){});
    setTimeout(function(){ V.tab('p1'); lm('',false); }, 900);
  }catch(e){
    /* 시간 초과는 서버에 들어갔는지 알 수 없다. 중복 등록을 막기 위해
       무조건 재시도하라고 하지 않고, 재고를 먼저 확인하도록 안내한다. */
    lm(V.failMsg(e, '[재고] 탭에서 반영 여부를 먼저 확인하세요.'), true);
  }finally{
    V.busy(false); btn.disabled = false; btn.textContent = '등록';
  }
}

function lm(t, err){
  const el = document.getElementById('logMsg');
  if(!el) return;
  el.textContent = t; el.className = 'msg' + (err ? ' err' : ' good');
}

/* ── 접근로그 (관리자) ──────────────────
   탭(접속 · 기록)과 표는 코어가 그린다.
     접속 = 로그인 성공 · 실패
     기록 = 입출고 등록 · 중복 요청 확인 · 권한거부
   시각은 서버가 한국시간 'yyyy-MM-dd HH:mm' 로 맞춰 보낸다.
   이 앱에서 따로 할 일은 없다. 새로고침 버튼이 V.loadLogs(true) 를 부른다. */
</script>
